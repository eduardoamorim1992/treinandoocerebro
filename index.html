s duplamente encravados: é preciso cruzar ao menos duas fronteiras para chegar ao oceano."},{"id":"1ug1rli","c":"geografia","d":5,"q":"Qual é o ponto mais alto da Antártida?","o":["Maciço Vinson","Monte Erebus","Monte Kirkpatrick","Monte Sidley"],"e":"O Vinson fica nos Montes Ellsworth e chega a quase 4.900 m; o Erebus é o vulcão ativo mais austral do planeta."},{"id":"9pqzxj","c":"geografia","d":5,"q":"Qual é o ponto culminante da ilha da Nova Guiné?","o":["Puncak Jaya","Monte Wilhelm","Puncak Trikora","Monte Giluwe"],"e":"Também chamado Pirâmide Carstensz, fica na parte indonésia da ilha e é o pico mais alto situado em uma ilha."},{"id":"19aikfq","c":"geografia","d":5,"q":"Qual é o ponto mais oriental do Brasil continental?","o":["Ponta do Seixas","Cabo de São Roque","Cabo de Santo Agostinho","Ponta do Calcanhar"],"e":"A Ponta do Seixas fica em João Pessoa, na Paraíba, ao lado do Cabo Branco, e é também o extremo leste das Américas continentais."},{"id":"z4k5ng","c":"geografia","d":5,"q":"Qual estreito liga o Mar Vermelho ao Golfo de Áden?","o":["Estreito de Bab el-Mandeb","Estreito de Ormuz","Estreito de Tiran","Estreito de Malaca"],"e":"O nome significa Porta das Lamentações em árabe; o estreito separa o Iêmen de Djibuti e da Eritreia."},{"id":"1vpy50r","c":"geografia","d":5,"q":"Qual vento seco e carregado de poeira sopra do Saara sobre a África Ocidental no inverno boreal?","o":["Harmatão","Siroco","Mistral","Bora"],"e":"O harmatão sopra de nordeste rumo ao Golfo da Guiné; o siroco também vem do Saara, mas segue para o Mediterrâneo."},{"id":"x6hpzu","c":"geografia","d":5,"q":"Qual é o ponto mais meridional do continente africano?","o":["Cabo das Agulhas","Cabo da Boa Esperança","Cabo Guardafui","Cabo Bojador"],"e":"O Cabo das Agulhas fica a sudeste do Cabo da Boa Esperança e é o marco oficial entre o Atlântico e o Índico."},{"id":"1yfyokw","c":"artes","d":1,"q":"Quem pintou a Mona Lisa?","o":["Leonardo da Vinci","Michelangelo","Rafael Sanzio","Sandro Botticelli"],"e":"Leonardo pintou o retrato no início do século XVI. Hoje ele fica no Museu do Louvre, em Paris."},{"id":"ygkmf6","c":"artes","d":1,"q":"Quem escreveu as histórias do Sítio do Picapau Amarelo?","o":["Monteiro Lobato","Ziraldo","Ruth Rocha","Mauricio de Sousa"],"e":"Lobato criou Emília, Narizinho e Pedrinho. Ziraldo fez o Menino Maluquinho e Mauricio de Sousa, a Turma da Mônica."},{"id":"at7vy5","c":"artes","d":1,"q":"Qual instrumento musical tem teclas brancas e pretas?","o":["Piano","Violino","Flauta","Tambor"],"e":"Um piano moderno tem 88 teclas: 52 brancas e 36 pretas. Cada tecla aciona um martelo que bate nas cordas."},{"id":"85lxsc","c":"artes","d":1,"q":"Misturando tinta azul com tinta amarela, que cor obtemos?","o":["Verde","Roxo","Laranja","Marrom"],"e":"Azul e amarelo formam o verde. Já o roxo vem de azul com vermelho, e o laranja, de amarelo com vermelho."},{"id":"wz9vaj","c":"artes","d":1,"q":"Em que país ficam as famosas pirâmides de Gizé?","o":["Egito","México","Grécia","Índia"],"e":"As pirâmides de Gizé foram construídas há mais de 4 mil anos como túmulos para faraós egípcios."},{"id":"1x019h5","c":"artes","d":1,"q":"Qual boneco de madeira tem o nariz que cresce quando ele mente?","o":["Pinóquio","Peter Pan","Gepeto","Pequeno Polegar"],"e":"Pinóquio foi criado pelo escritor italiano Carlo Collodi. Gepeto é o carpinteiro que esculpe o boneco."},{"id":"rgn6fw","c":"artes","d":1,"q":"Como se chama a arte de fazer estátuas?","o":["Escultura","Pintura","Gravura","Arquitetura"],"e":"O escultor dá forma a materiais como pedra, madeira, argila ou metal, criando obras em três dimensões."},{"id":"12uy6ue","c":"artes","d":1,"q":"Em que cidade fica a Torre Eiffel?","o":["Paris","Londres","Roma","Madri"],"e":"A torre de ferro foi erguida em Paris para a Exposição Universal de 1889 e leva o nome do engenheiro Gustave Eiffel."},{"id":"1uoc5ed","c":"artes","d":1,"q":"Como se chama a pessoa que rege uma orquestra usando uma batuta?","o":["Maestro","Solista","Tenor","Compositor"],"e":"O maestro coordena os músicos, marcando o ritmo e a intensidade. O compositor é quem escreve a música."},{"id":"hu1i5a","c":"artes","d":1,"q":"Qual estátua de braços abertos fica no alto do morro do Corcovado, no Rio de Janeiro?","o":["Cristo Redentor","Padre Cícero","Borba Gato","Cristo Rei"],"e":"O Cristo Redentor foi inaugurado em 1931 e tem cerca de 30 metros de altura, sem contar o pedestal."},{"id":"1s68b64","c":"artes","d":2,"q":"Quem escreveu o romance 'Dom Casmurro'?","o":["Machado de Assis","José de Alencar","Aluísio Azevedo","Lima Barreto"],"e":"Publicado em 1899, o livro é narrado por Bentinho, que desconfia de uma traição de sua esposa, Capitu."},{"id":"adt7pm","c":"artes","d":2,"q":"Quem pintou o teto da Capela Sistina, no Vaticano?","o":["Michelangelo","Leonardo da Vinci","Rafael","Caravaggio"],"e":"Michelangelo pintou o teto entre 1508 e 1512. A cena mais famosa é 'A Criação de Adão'."},{"id":"2l34h1","c":"artes","d":2,"q":"Quem escreveu a peça 'Romeu e Julieta'?","o":["William Shakespeare","Charles Dickens","Victor Hugo","Oscar Wilde"],"e":"A tragédia de Shakespeare se passa em Verona, na Itália, e conta o amor entre jovens de famílias rivais."},{"id":"1g1r0t1","c":"artes","d":2,"q":"Qual pintor holandês é o autor de 'A Noite Estrelada'?","o":["Vincent van Gogh","Rembrandt","Johannes Vermeer","Piet Mondrian"],"e":"Van Gogh pintou a tela em 1889, quando estava internado em um hospício em Saint-Rémy, no sul da França."},{"id":"tdl620","c":"artes","d":2,"q":"Qual arquiteto projetou os principais edifícios de Brasília?","o":["Oscar Niemeyer","Lúcio Costa","Burle Marx","Lina Bo Bardi"],"e":"Niemeyer desenhou os prédios, como a Catedral e o Congresso. Lúcio Costa fez o plano urbanístico da cidade."},{"id":"tg0h6t","c":"artes","d":2,"q":"Qual compositor continuou criando grandes obras mesmo depois de ficar surdo?","o":["Beethoven","Mozart","Bach","Chopin"],"e":"Beethoven perdeu a audição aos poucos e compôs a Nona Sinfonia, de 1824, já praticamente surdo."},{"id":"9k499y","c":"artes","d":2,"q":"Quem escreveu 'O Pequeno Príncipe'?","o":["Antoine de Saint-Exupéry","Júlio Verne","Hans Christian Andersen","Lewis Carroll"],"e":"Saint-Exupéry era aviador, assim como o narrador do livro, publicado em 1943."},{"id":"1lgopyf","c":"artes","d":2,"q":"Qual pintora brasileira criou o quadro 'Abaporu'?","o":["Tarsila do Amaral","Anita Malfatti","Djanira","Lygia Clark"],"e":"Pintado em 1928, o quadro inspirou o Movimento Antropofágico. O nome vem do tupi: 'homem que come gente'."},{"id":"ql8aju","c":"artes","d":2,"q":"De qual filósofo grego Platão foi discípulo?","o":["Sócrates","Aristóteles","Pitágoras","Heráclito"],"e":"Sócrates não deixou nada escrito; conhecemos suas ideias pelos diálogos de Platão. Aristóteles foi aluno de Platão."},{"id":"16j0vuf","c":"artes","d":2,"q":"Qual personagem de Miguel de Cervantes luta contra moinhos de vento?","o":["Dom Quixote","Sancho Pança","Dom Juan","El Cid"],"e":"Dom Quixote confunde os moinhos com gigantes. Sancho Pança é seu fiel escudeiro, que tenta avisá-lo do engano."},{"id":"xlqjgi","c":"artes","d":3,"q":"Em que cidade ocorreu a Semana de Arte Moderna de 1922?","o":["São Paulo","Rio de Janeiro","Belo Horizonte","Recife"],"e":"O evento aconteceu no Theatro Municipal de São Paulo e marcou o início do Modernismo brasileiro."},{"id":"lxvpnh","c":"artes","d":3,"q":"Quem escreveu o poema épico 'Os Lusíadas'?","o":["Luís de Camões","Fernando Pessoa","Gil Vicente","Eça de Queirós"],"e":"Publicado em 1572, o poema celebra a viagem de Vasco da Gama às Índias e a história de Portugal."},{"id":"1aysu9a","c":"artes","d":3,"q":"Quem pintou 'Guernica', sobre o bombardeio de uma cidade na Guerra Civil Espanhola?","o":["Pablo Picasso","Salvador Dalí","Joan Miró","Francisco de Goya"],"e":"Picasso pintou o painel em 1937, em preto, branco e cinza. Ele está no Museu Reina Sofía, em Madri."},{"id":"17biqk1","c":"artes","d":3,"q":"Quem escreveu 'Grande Sertão: Veredas'?","o":["João Guimarães Rosa","Graciliano Ramos","Jorge Amado","Euclides da Cunha"],"e":"O romance de 1956 é narrado pelo ex-jagunço Riobaldo e é famoso pela linguagem inventiva, cheia de neologismos."},{"id":"44omrl","c":"artes","d":3,"q":"Qual filósofo é o autor da frase 'Penso, logo existo'?","o":["René Descartes","Immanuel Kant","Baruch Espinosa","Blaise Pascal"],"e":"A frase aparece no 'Discurso do Método' (1637): duvidar de tudo prova ao menos que existe alguém que duvida."},{"id":"190ba15","c":"artes","d":3,"q":"Quem compôs o conjunto de concertos 'As Quatro Estações'?","o":["Antonio Vivaldi","Johann Sebastian Bach","Georg Friedrich Händel","Joseph Haydn"],"e":"Vivaldi, compositor barroco de Veneza, publicou em 1725 os quatro concertos para violino, um para cada estação."},{"id":"16d3t4u","c":"artes","d":3,"q":"A qual movimento artístico pertence o pintor Claude Monet?","o":["Impressionismo","Cubismo","Surrealismo","Expressionismo"],"e":"Os impressionistas pintavam ao ar livre para captar a luz do momento, com pinceladas soltas e visíveis."},{"id":"n7afpb","c":"artes","d":3,"q":"Quem esculpiu 'O Pensador'?","o":["Auguste Rodin","Michelangelo","Donatello","Bernini"],"e":"A figura foi criada por Rodin para o conjunto 'A Porta do Inferno', inspirado em Dante, e depois ampliada."},{"id":"1q31uhy","c":"artes","d":3,"q":"Qual romance de Graciliano Ramos narra a fuga de uma família de retirantes com a cachorra Baleia?","o":["Vidas Secas","São Bernardo","Angústia","Caetés"],"e":"Publicado em 1938, o livro acompanha Fabiano, Sinhá Vitória e os filhos fugindo da seca no sertão."},{"id":"am57hx","c":"artes","d":3,"q":"Qual arquiteto catalão projetou a basílica da Sagrada Família, em Barcelona?","o":["Antoni Gaudí","Santiago Calatrava","Le Corbusier","Josep Puig i Cadafalch"],"e":"Gaudí assumiu a obra em 1883 e trabalhou nela até morrer, em 1926. Suas formas se inspiram na natureza."},{"id":"1wiu9pw","c":"artes","d":4,"q":"Qual heterônimo de Fernando Pessoa é o autor de 'O Guardador de Rebanhos'?","o":["Alberto Caeiro","Ricardo Reis","Álvaro de Campos","Bernardo Soares"],"e":"Caeiro é o poeta da natureza e das sensações, considerado o mestre dos outros heterônimos e do próprio Pessoa."},{"id":"1imalgv","c":"artes","d":4,"q":"Quem pintou 'As Meninas', de 1656?","o":["Diego Velázquez","El Greco","Francisco de Goya","Bartolomé Murillo"],"e":"Na tela, Velázquez retrata a si mesmo pintando, ao lado da infanta Margarida. A obra está no Museu do Prado."},{"id":"1yk0g4c","c":"artes","d":4,"q":"Em que cidade mineira ficam os Doze Profetas esculpidos por Aleijadinho?","o":["Congonhas","Ouro Preto","Mariana","Tiradentes"],"e":"As estátuas em pedra-sabão ficam no adro do Santuário do Bom Jesus de Matosinhos, Patrimônio Mundial da UNESCO."},{"id":"1t98h0k","c":"artes","d":4,"q":"Em qual ópera de Mozart aparece a personagem Rainha da Noite?","o":["A Flauta Mágica","Don Giovanni","As Bodas de Fígaro","Così fan tutte"],"e":"A ópera estreou em Viena em 1791, ano da morte de Mozart. A ária da Rainha exige notas agudíssimas da soprano."},{"id":"zx9chr","c":"artes","d":4,"q":"Qual romance de Dostoiévski tem o estudante Raskólnikov como protagonista?","o":["Crime e Castigo","Os Irmãos Karamázov","O Idiota","Os Demônios"],"e":"No romance de 1866, Raskólnikov mata uma velha agiota e é consumido pela culpa até confessar o crime."},{"id":"193bso9","c":"artes","d":4,"q":"Quem projetou a cúpula da catedral de Santa Maria del Fiore, em Florença?","o":["Filippo Brunelleschi","Leon Battista Alberti","Donato Bramante","Giotto di Bondone"],"e":"Brunelleschi ergueu a cúpula no século XV sem cimbre de madeira, usando casca dupla. Giotto projetou o campanário."},{"id":"1fn41vu","c":"artes","d":4,"q":"Qual romance de Aluísio Azevedo, de 1881, é considerado o marco inicial do Naturalismo no Brasil?","o":["O Mulato","O Cortiço","Casa de Pensão","O Coruja"],"e":"O livro denuncia o preconceito racial em São Luís do Maranhão. 'O Cortiço', mais famoso, só saiu em 1890."},{"id":"m1pqwd","c":"artes","d":4,"q":"Qual pintor é o autor do tríptico 'O Jardim das Delícias Terrenas'?","o":["Hieronymus Bosch","Pieter Bruegel, o Velho","Jan van Eyck","Albrecht Dürer"],"e":"O tríptico mostra o Paraíso, os prazeres terrenos e o Inferno, com figuras fantásticas. Está no Museu do Prado."},{"id":"tgzlzv","c":"artes","d":4,"q":"Qual filósofo é o autor de 'Assim Falou Zaratustra'?","o":["Friedrich Nietzsche","Arthur Schopenhauer","Martin Heidegger","Søren Kierkegaard"],"e":"Na obra, Nietzsche apresenta as ideias do além-do-homem e do eterno retorno pela voz do profeta Zaratustra."},{"id":"19zyjqp","c":"artes","d":4,"q":"Qual artista barroco esculpiu 'O Êxtase de Santa Teresa'?","o":["Gian Lorenzo Bernini","Antonio Canova","Benvenuto Cellini","Donatello"],"e":"A escultura em mármore fica na igreja de Santa Maria della Vittoria, em Roma, e é um ícone do Barroco."},{"id":"1wzzqif","c":"artes","d":5,"q":"Em qual teatro estreou a ópera 'Il Guarany', de Carlos Gomes, em 1870?","o":["Teatro alla Scala, em Milão","Teatro La Fenice, em Veneza","Teatro San Carlo, em Nápoles","Teatro Regio, em Turim"],"e":"Baseada no romance de José de Alencar, a ópera foi cantada em italiano e consagrou Carlos Gomes na Europa."},{"id":"ahp4iv","c":"artes","d":5,"q":"Qual filósofo pré-socrático afirmou que o princípio de todas as coisas é o 'ápeiron'?","o":["Anaximandro","Anaxímenes","Tales de Mileto","Heráclito"],"e":"Ápeiron significa o ilimitado ou indeterminado. Para Tales, o princípio era a água; para Anaxímenes, o ar."},{"id":"5jfu9v","c":"artes","d":5,"q":"Qual é o número do Réquiem de Mozart no catálogo Köchel?","o":["K. 626","K. 550","K. 525","K. 620"],"e":"É o último número do catálogo: Mozart morreu sem terminar a obra. K. 620 é 'A Flauta Mágica'."},{"id":"1p5v8n6","c":"artes","d":5,"q":"Qual arquiteto projetou a igreja de San Carlo alle Quattro Fontane, em Roma?","o":["Francesco Borromini","Gian Lorenzo Bernini","Pietro da Cortona","Carlo Maderno"],"e":"A pequena igreja, de fachada ondulada e planta oval, é a obra-prima de Borromini, grande rival de Bernini."},{"id":"wyos67","c":"artes","d":5,"q":"Quem pintou 'O Casal Arnolfini', de 1434?","o":["Jan van Eyck","Rogier van der Weyden","Hans Memling","Robert Campin"],"e":"A tela, na National Gallery de Londres, traz um espelho convexo ao fundo e a assinatura do pintor na parede."},{"id":"1cvfhct","c":"artes","d":5,"q":"Em que ano se passa o único dia narrado em 'Ulisses', de James Joyce?","o":["1904","1914","1922","1900"],"e":"Toda a ação ocorre em Dublin, em 16 de junho de 1904, data hoje festejada como Bloomsday. O livro saiu em 1922."},{"id":"1gyjjgo","c":"artes","d":5,"q":"Como se chama o narrador de 'O Ateneu', de Raul Pompeia?","o":["Sérgio","Aristarco","Bento","Carlos"],"e":"Sérgio relembra, já adulto, sua vida no internato dirigido por Aristarco. O romance é de 1888."},{"id":"7p8fqq","c":"artes","d":5,"q":"Qual escultor fez as 'Portas do Paraíso' do Batistério de Florença?","o":["Lorenzo Ghiberti","Andrea Pisano","Luca della Robbia","Donatello"],"e":"Ghiberti levou 27 anos nos dez painéis de bronze dourado. O apelido das portas é atribuído a Michelangelo."},{"id":"jpqxry","c":"artes","d":5,"q":"Qual obra de Wittgenstein termina com 'Sobre aquilo de que não se pode falar, deve-se calar'?","o":["Tractatus Logico-Philosophicus","Investigações Filosóficas","Da Certeza","O Livro Azul"],"e":"É a sétima e última proposição do Tractatus (1921), único livro de filosofia que ele publicou em vida."},{"id":"1grz29e","c":"artes","d":5,"q":"Qual foi o romance de estreia de Clarice Lispector, publicado em 1943?","o":["Perto do Coração Selvagem","A Paixão Segundo G.H.","A Cidade Sitiada","A Maçã no Escuro"],"e":"O título vem de uma frase de James Joyce. O livro, centrado na personagem Joana, surpreendeu pelo fluxo de consciência."},{"id":"1qmjp3","c":"cultura","d":1,"q":"Quantos jogadores de cada time ficam em campo no início de uma partida de futebol?","o":["Onze","Dez","Nove","Doze"],"e":"São dez jogadores de linha e um goleiro, o único que pode usar as mãos dentro da sua área."},{"id":"1ykan4w","c":"cultura","d":1,"q":"Em qual destes países as pessoas tradicionalmente comem usando hashi, os palitinhos?","o":["Japão","Índia","Egito","Rússia"],"e":"O hashi é usado no Japão e em vizinhos como China e Coreia. Na Índia, é comum comer com a mão direita."},{"id":"ocpb8j","c":"cultura","d":1,"q":"Qual país é famoso por ser a terra da pizza?","o":["Itália","França","Espanha","Grécia"],"e":"A pizza como conhecemos nasceu na cidade de Nápoles, no sul da Itália, e depois se espalhou pelo mundo."},{"id":"1h432t","c":"cultura","d":1,"q":"Na mitologia grega, quem é o rei dos deuses, que lança raios do céu?","o":["Zeus","Poseidon","Hades","Apolo"],"e":"Zeus governava do Monte Olimpo. Seus irmãos Poseidon e Hades reinavam sobre o mar e o mundo dos mortos."},{"id":"1khozkn","c":"cultura","d":1,"q":"Quantas letras tem o alfabeto da língua portuguesa?","o":["26","23","24","28"],"e":"Eram 23 letras até o Acordo Ortográfico incluir oficialmente o K, o W e o Y, somando 26."},{"id":"15o94mq","c":"cultura","d":1,"q":"No desenho 'O Rei Leão', qual é o nome do filhote que se torna rei?","o":["Simba","Mufasa","Scar","Timão"],"e":"Simba é filho do rei Mufasa. Seu nome significa 'leão' em suaíli, língua falada no leste da África."},{"id":"189d3sp","c":"cultura","d":1,"q":"Em qual esporte se usa uma raquete para rebater uma bolinha amarela por cima de uma rede?","o":["Tênis","Vôlei","Basquete","Handebol"],"e":"No tênis, a bola pode quicar só uma vez de cada lado. As partidas são divididas em games e sets."},{"id":"11n7a2m","c":"cultura","d":1,"q":"Além do chocolate, qual é o ingrediente principal do brigadeiro?","o":["Leite condensado","Creme de leite","Doce de leite","Leite de coco"],"e":"O doce brasileiro leva leite condensado, chocolate e manteiga, e é enrolado em bolinhas com granulado."},{"id":"1i98qwk","c":"cultura","d":1,"q":"De quantos em quantos anos acontecem os Jogos Olímpicos de Verão?","o":["Quatro","Dois","Três","Cinco"],"e":"O intervalo de quatro anos entre os Jogos se chama olimpíada, costume herdado da Grécia Antiga."},{"id":"11mx97d","c":"cultura","d":1,"q":"Qual é o plural correto da palavra 'pão'?","o":["Pães","Pãos","Pões","Pãoes"],"e":"Palavras em -ão têm três plurais possíveis: pães, mãos e limões são exemplos de cada um deles."},{"id":"f2ecx5","c":"cultura","d":2,"q":"Qual banda inglesa era formada por John, Paul, George e Ringo?","o":["The Beatles","The Rolling Stones","The Who","The Kinks"],"e":"O quarteto surgiu em Liverpool e se separou em 1970, depois de transformar a música pop dos anos 1960."},{"id":"13mggya","c":"cultura","d":2,"q":"Qual herói grego tinha o calcanhar como único ponto fraco?","o":["Aquiles","Hércules","Ulisses","Perseu"],"e":"Segundo o mito, a mãe o mergulhou no rio Estige segurando-o pelo calcanhar, que ficou vulnerável."},{"id":"pove4e","c":"cultura","d":2,"q":"Qual é o substantivo coletivo de lobos?","o":["Alcateia","Matilha","Manada","Cardume"],"e":"Matilha é o coletivo de cães, manada é de bois ou elefantes, e cardume é de peixes."},{"id":"ymt6g6","c":"cultura","d":2,"q":"O sushi é um prato típico da culinária de qual país?","o":["Japão","China","Tailândia","Vietnã"],"e":"O que define o sushi é o arroz temperado com vinagre. O peixe cru servido sozinho se chama sashimi."},{"id":"1gmmwyn","c":"cultura","d":2,"q":"Em que cidade da Grécia Antiga eram disputados os Jogos Olímpicos?","o":["Olímpia","Atenas","Esparta","Corinto"],"e":"Os jogos homenageavam Zeus no santuário de Olímpia. Atenas sediou a primeira edição moderna, em 1896."},{"id":"t4bwfv","c":"cultura","d":2,"q":"Qual artista do cinema mudo criou o personagem Carlitos, o vagabundo de bigode e bengala?","o":["Charlie Chaplin","Buster Keaton","Harold Lloyd","Stan Laurel"],"e":"Chaplin atuava, dirigia e compunha as trilhas de filmes como 'O Garoto' e 'Tempos Modernos'."},{"id":"13a7tp9","c":"cultura","d":2,"q":"Em qual sílaba fica a tônica de uma palavra proparoxítona?","o":["Antepenúltima","Penúltima","Última","Primeira"],"e":"Todas as proparoxítonas são acentuadas em português, como 'lâmpada', 'médico' e 'pássaro'."},{"id":"vmj10u","c":"cultura","d":2,"q":"Na mitologia romana, quem é o deus da guerra?","o":["Marte","Júpiter","Netuno","Vulcano"],"e":"Marte corresponde ao grego Ares e deu nome ao mês de março e ao planeta vermelho."},{"id":"18ttzcg","c":"cultura","d":2,"q":"Em qual categoria do automobilismo Ayrton Senna foi tricampeão mundial?","o":["Fórmula 1","Fórmula Indy","Rali","Stock Car"],"e":"Senna venceu os campeonatos de 1988, 1990 e 1991, todos pela equipe McLaren."},{"id":"1mg2og7","c":"cultura","d":2,"q":"Em que país o Dia dos Mortos é celebrado com altares coloridos, flores e caveiras de açúcar?","o":["México","Espanha","Peru","Argentina"],"e":"A festa mexicana mistura tradições indígenas e católicas: as famílias recebem com alegria a visita dos antepassados."},{"id":"1kl8av0","c":"cultura","d":3,"q":"De qual língua veio a maior parte do vocabulário do português?","o":["Latim","Grego","Árabe","Tupi"],"e":"O português é uma língua românica: nasceu do latim vulgar falado pelos romanos na Península Ibérica."},{"id":"17oa07f","c":"cultura","d":3,"q":"Qual figura de linguagem consiste em um exagero intencional, como em 'morri de rir'?","o":["Hipérbole","Metáfora","Eufemismo","Metonímia"],"e":"A hipérbole exagera para dar ênfase. O eufemismo faz o contrário: suaviza uma ideia desagradável."},{"id":"2fqmva","c":"cultura","d":3,"q":"Na mitologia grega, quem roubou o fogo dos deuses para entregá-lo aos homens?","o":["Prometeu","Hefesto","Ícaro","Sísifo"],"e":"Como castigo, Zeus o acorrentou a um rochedo, onde uma águia devorava seu fígado todos os dias."},{"id":"9dylam","c":"cultura","d":3,"q":"Quem dirigiu o filme 'Psicose', de 1960?","o":["Alfred Hitchcock","Orson Welles","Stanley Kubrick","Billy Wilder"],"e":"Conhecido como mestre do suspense, Hitchcock criou no filme a célebre cena do assassinato no chuveiro."},{"id":"12rskh1","c":"cultura","d":3,"q":"Qual canção de Tom Jobim e Vinicius de Moraes fala de uma moça que passa a caminho do mar?","o":["Garota de Ipanema","Chega de Saudade","Insensatez","Água de Beber"],"e":"Lançada em 1962, a canção foi inspirada em Helô Pinheiro e virou um dos maiores sucessos mundiais da bossa nova."},{"id":"sr7uma","c":"cultura","d":3,"q":"Em que país o Brasil conquistou sua primeira Copa do Mundo de futebol, em 1958?","o":["Suécia","Chile","Suíça","México"],"e":"O Brasil venceu a anfitriã Suécia por 5 a 2 na final, com dois gols de Pelé, então com 17 anos."},{"id":"1ferjqi","c":"cultura","d":3,"q":"Qual quitute baiano é um bolinho de feijão-fradinho frito no azeite de dendê?","o":["Acarajé","Abará","Vatapá","Caruru"],"e":"De origem africana, o acarajé é comida ritual do candomblé. O abará usa a mesma massa, mas cozida no vapor."},{"id":"1cso4g8","c":"cultura","d":3,"q":"Qual é a distância oficial de uma maratona?","o":["42,195 km","40,000 km","41,195 km","42,500 km"],"e":"A medida foi usada nos Jogos de Londres de 1908 e depois adotada como padrão oficial da prova."},{"id":"17ltmnl","c":"cultura","d":3,"q":"Na mitologia nórdica, como se chama o martelo de Thor?","o":["Mjölnir","Gungnir","Draupnir","Gleipnir"],"e":"Gungnir é a lança de Odin, Draupnir é seu anel de ouro e Gleipnir é a corrente que prende o lobo Fenrir."},{"id":"p2srrt","c":"cultura","d":3,"q":"De qual língua o português herdou palavras como 'alface', 'almofada' e 'açúcar'?","o":["Árabe","Tupi","Grego","Francês"],"e":"Os árabes dominaram parte da Península Ibérica por séculos. O 'al' inicial de muitas palavras é o artigo árabe."},{"id":"1upwk30","c":"cultura","d":4,"q":"Na mitologia grega, qual das nove musas é a protetora da História?","o":["Clio","Calíope","Érato","Tália"],"e":"As musas eram filhas de Zeus e Mnemósine, a Memória. Calíope inspirava a poesia épica e Tália, a comédia."},{"id":"1r8298q","c":"cultura","d":4,"q":"Qual processo de formação de palavras deu origem a 'planalto'?","o":["Composição por aglutinação","Composição por justaposição","Derivação parassintética","Derivação regressiva"],"e":"Na aglutinação, os elementos se fundem e perdem fonemas: plano + alto. Na justaposição ficam intactos, como em 'girassol'."},{"id":"1ysvutv","c":"cultura","d":4,"q":"Quem dirigiu o filme 'Os Sete Samurais', de 1954?","o":["Akira Kurosawa","Yasujiro Ozu","Kenji Mizoguchi","Ishiro Honda"],"e":"O épico de Kurosawa inspirou o faroeste americano 'Sete Homens e um Destino', lançado em 1960."},{"id":"1ny9sjh","c":"cultura","d":4,"q":"Qual brasileiro foi bicampeão olímpico do salto triplo, em 1952 e 1956?","o":["Adhemar Ferreira da Silva","João Carlos de Oliveira","Nelson Prudêncio","José Telles da Conceição"],"e":"Adhemar venceu em Helsinque e em Melbourne. João do Pulo e Nelson Prudêncio também ganharam medalhas na prova."},{"id":"1drh1hr","c":"cultura","d":4,"q":"Qual especiaria é obtida dos estigmas secos de uma flor do gênero Crocus?","o":["Açafrão","Cardamomo","Cúrcuma","Noz-moscada"],"e":"Cada flor dá só três estigmas, colhidos à mão, o que faz do açafrão verdadeiro uma especiaria caríssima."},{"id":"x6xhj7","c":"cultura","d":4,"q":"Qual filme brasileiro ganhou a Palma de Ouro no Festival de Cannes de 1962?","o":["O Pagador de Promessas","Terra em Transe","O Cangaceiro","Deus e o Diabo na Terra do Sol"],"e":"Dirigido por Anselmo Duarte e baseado na peça de Dias Gomes, o filme conta a promessa de Zé do Burro."},{"id":"1h7q6ji","c":"cultura","d":4,"q":"Na mitologia grega, como se chama o rio do esquecimento, no mundo dos mortos?","o":["Lete","Estige","Aqueronte","Cócito"],"e":"Quem bebia do Lete esquecia a vida passada. Os deuses faziam seus juramentos mais solenes pelo Estige."},{"id":"1fo0hw5","c":"cultura","d":4,"q":"Quem compôs 'Asa Branca' em parceria com Humberto Teixeira?","o":["Luiz Gonzaga","Jackson do Pandeiro","Dominguinhos","Zé Dantas"],"e":"Lançada em 1947, a canção sobre a seca e a saudade do sertão tornou-se o hino do baião e do Nordeste."},{"id":"u58w17","c":"cultura","d":4,"q":"De qual língua vem a palavra 'abacaxi'?","o":["Tupi","Quimbundo","Árabe","Quíchua"],"e":"O termo vem do tupi e costuma ser explicado como 'fruta cheirosa'. Em Portugal, a fruta é chamada de ananás."},{"id":"1fugh17","c":"cultura","d":4,"q":"Como se chama a tradicional cerimônia do chá japonesa?","o":["Chanoyu","Ikebana","Hanami","Kabuki"],"e":"Ikebana é a arte dos arranjos florais, hanami é a contemplação das cerejeiras e kabuki é um gênero de teatro."},{"id":"14uvbqr","c":"cultura","d":5,"q":"Qual das três Moiras gregas era a responsável por cortar o fio da vida?","o":["Átropos","Cloto","Láquesis","Nêmesis"],"e":"Cloto fiava o fio da vida, Láquesis media seu comprimento e Átropos, 'a inflexível', o cortava."},{"id":"tp137h","c":"cultura","d":5,"q":"Na mitologia nórdica, como se chama o cavalo de oito patas de Odin?","o":["Sleipnir","Fenrir","Huginn","Gullinbursti"],"e":"Sleipnir é filho de Loki. Fenrir é um lobo gigante, Huginn é um corvo de Odin e Gullinbursti é o javali de Freyr."},{"id":"1wjakds","c":"cultura","d":5,"q":"A passagem do latim 'amare' ao português 'amar' ilustra qual metaplasmo?","o":["Apócope","Síncope","Aférese","Prótese"],"e":"Apócope é a queda de fonema no fim da palavra. Na aférese a queda é no início e, na síncope, no meio."},{"id":"f31h5m","c":"cultura","d":5,"q":"De qual língua vem a palavra 'moleque'?","o":["Quimbundo","Tupi","Árabe","Iorubá"],"e":"Vem do quimbundo 'muleke', menino. Essa língua banta de Angola também nos deu 'caçula' e 'cochilar'."},{"id":"12vhlsf","c":"cultura","d":5,"q":"Quem dirigiu 'Limite', clássico do cinema mudo brasileiro lançado em 1931?","o":["Mário Peixoto","Humberto Mauro","Alberto Cavalcanti","Adhemar Gonzaga"],"e":"Foi o único filme concluído por Mário Peixoto, que o realizou com pouco mais de 20 anos de idade."},{"id":"lkxz6e","c":"cultura","d":5,"q":"Quem escreveu a letra de 'Carinhoso', melodia composta por Pixinguinha?","o":["Braguinha","Noel Rosa","Lamartine Babo","Ary Barroso"],"e":"A melodia é dos anos 1910, mas a letra de Braguinha, o João de Barro, só veio em 1937, na voz de Orlando Silva."},{"id":"illzy1","c":"cultura","d":5,"q":"Quem marcou o gol da vitória do Uruguai sobre o Brasil no jogo decisivo da Copa de 1950?","o":["Alcides Ghiggia","Juan Schiaffino","Obdulio Varela","Óscar Míguez"],"e":"Schiaffino empatou e Ghiggia virou para 2 a 1 no Maracanã, no episódio conhecido como Maracanaço."},{"id":"l4gm97","c":"cultura","d":5,"q":"Qual molho-mãe da cozinha francesa é feito de caldo claro engrossado com roux?","o":["Velouté","Béchamel","Espagnole","Hollandaise"],"e":"O béchamel usa leite no lugar do caldo, e o espagnole, caldo escuro. Roux é farinha cozida na manteiga."},{"id":"1k3jbmc","c":"cultura","d":5,"q":"Como se chama o ano-novo persa, celebrado no equinócio de março?","o":["Nowruz","Yalda","Mehregan","Tirgan"],"e":"Nowruz significa 'novo dia' e marca o início da primavera no hemisfério norte. Yalda festeja o solstício de inverno."},{"id":"1el2gex","c":"cultura","d":5,"q":"Na mitologia egípcia, o coração do morto era pesado contra a pena de qual deusa?","o":["Maat","Ísis","Néftis","Hátor"],"e":"Maat personificava a verdade e a justiça. Se o coração pesasse mais que a pena, era devorado pelo monstro Ammit."}];</script>
<script>/* Sinapse — geradores de exercícios de matemática (7 níveis).
   Cada gerador devolve { p: enunciado, x: expressão em HTML (opcional),
   a: resposta inteira  OU  o: [correta, errada, errada, errada], e: explicação }. */
(function (root) {
  'use strict';

  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function helpers(rng) {
    const int = (a, b) => a + Math.floor(rng() * (b - a + 1));
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    const nz = (a, b) => { let v; do { v = int(a, b); } while (v === 0); return v; };
    const shuffle = (arr) => {
      const c = arr.slice();
      for (let i = c.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [c[i], c[j]] = [c[j], c[i]];
      }
      return c;
    };
    return { int, pick, nz, shuffle, rng };
  }

  // ---------- formatação ----------
  const M = '−'; // sinal de menos tipográfico
  const n = (v) => (v < 0 ? M + Math.abs(v) : String(v));
  const par = (v) => (v < 0 ? '(' + n(v) + ')' : String(v));
  const sup = (v) => '<sup>' + v + '</sup>';
  const sub = (v) => '<sub>' + v + '</sub>';
  const pm = (v) => (v < 0 ? ' ' + M + ' ' : ' + ') + Math.abs(v);

  function poly(terms, x) {
    x = x || 'x';
    let out = '';
    terms.filter((t) => t[0] !== 0).forEach(function (t, i) {
      const c = t[0], e = t[1], a = Math.abs(c);
      const body = e === 0 ? String(a) : (a === 1 ? '' : a) + x + (e === 1 ? '' : sup(e));
      out += i === 0 ? (c < 0 ? M : '') + body : (c < 0 ? ' ' + M + ' ' : ' + ') + body;
    });
    return out || '0';
  }
  const lin = (a, b) => poly([[a, 1], [b, 0]]);

  function gcd(a, b) { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; }
  function frac(p, q) {
    if (q < 0) { p = -p; q = -q; }
    const g = gcd(p, q) || 1;
    p /= g; q /= g;
    return q === 1 ? n(p) : n(p) + '/' + q;
  }
  function fact(k) { let r = 1; for (let i = 2; i <= k; i++) r *= i; return r; }
  function comb(nn, k) { let r = 1; for (let i = 1; i <= k; i++) r = (r * (nn - k + i)) / i; return Math.round(r); }
  function modpow(a, b, m) { let r = 1; a %= m; while (b > 0) { if (b & 1) r = (r * a) % m; a = (a * a) % m; b >>= 1; } return r; }
  function phi(v) { let r = 0; for (let i = 1; i <= v; i++) if (gcd(i, v) === 1) r++; return r; }

  function options(correct, wrongs) {
    const seen = new Set([String(correct)]);
    const o = [String(correct)];
    for (const w of wrongs) {
      const s = String(w);
      if (!seen.has(s)) { seen.add(s); o.push(s); }
      if (o.length === 4) break;
    }
    return o;
  }
  function matrix(rows) {
    const cells = rows.map((r) => r.map((v) => '<i>' + n(v) + '</i>').join('')).join('');
    return '<span class="mx" style="--n:' + rows.length + '">' + cells + '</span>';
  }
  const integral = (lo, hi, body) =>
    '<span class="int">∫<span class="lims"><sup>' + n(hi) + '</sup><sub>' + n(lo) + '</sub></span></span> ' + body + ' dx';
  const limit = (to, body) => 'lim' + sub('x→' + to) + ' ' + body;
  const cplx = (a, b) => n(a) + (b < 0 ? ' ' + M + ' ' : ' + ') + (Math.abs(b) === 1 ? '' : Math.abs(b)) + 'i';

  const LEVELS = ['Iniciante', 'Básico', 'Intermediário', 'Avançado', 'Especialista', 'Mestre', 'Lendário'];
  const SKILLS = {
    aritmetica: 'Aritmética',
    fracoes: 'Frações e porcentagem',
    algebra: 'Álgebra',
    geometria: 'Geometria e trigonometria',
    funcoes: 'Funções e sequências',
    contagem: 'Contagem e probabilidade',
    calculo: 'Cálculo',
    numeros: 'Teoria dos números',
    linear: 'Matrizes e complexos'
  };
  const TRIPLES = [[3, 4, 5], [5, 12, 13], [8, 15, 17], [7, 24, 25], [20, 21, 29]];

  const G = [];
  const add = (id, L, s, t, fast, g) => G.push({ id, L, s, t, fast, g });

  // ================= NÍVEL 1 — Iniciante =================
  add('soma1', 1, 'aritmetica', 'Soma até 20', true, (r) => {
    const a = r.int(1, 10), b = r.int(1, 10);
    return { p: 'Quanto é?', x: a + ' + ' + b, a: a + b, e: a + ' + ' + b + ' = ' + (a + b) + '.' };
  });
  add('sub1', 1, 'aritmetica', 'Subtração até 20', true, (r) => {
    const a = r.int(5, 20), b = r.int(1, a - 1);
    return { p: 'Quanto é?', x: a + ' ' + M + ' ' + b, a: a - b, e: a + ' ' + M + ' ' + b + ' = ' + (a - b) + '.' };
  });
  add('falta1', 1, 'algebra', 'Número que falta', true, (r) => {
    const a = r.int(1, 10), b = r.int(1, 10);
    return { p: 'Qual número completa a conta?', x: a + ' + ? = ' + (a + b), a: b, e: (a + b) + ' ' + M + ' ' + a + ' = ' + b + '.' };
  });
  add('dobro1', 1, 'aritmetica', 'Dobro e metade', true, (r) => {
    const v = r.int(2, 20);
    return r.rng() < 0.5
      ? { p: 'Qual é o dobro de ' + v + '?', a: 2 * v, e: 'Dobro é somar o número com ele mesmo: ' + v + ' + ' + v + ' = ' + 2 * v + '.' }
      : { p: 'Qual é a metade de ' + 2 * v + '?', a: v, e: v + ' + ' + v + ' = ' + 2 * v + ', então a metade é ' + v + '.' };
  });
  add('seq1', 1, 'funcoes', 'Sequências simples', false, (r) => {
    const s = r.int(1, 9), k = r.int(2, 5);
    const t = [0, 1, 2, 3].map((i) => s + i * k);
    return { p: 'Qual é o próximo número da sequência?', x: t.join(', ') + ', ?', a: s + 4 * k, e: 'A sequência soma ' + k + ' a cada passo: ' + t[3] + ' + ' + k + ' = ' + (s + 4 * k) + '.' };
  });

  // ================= NÍVEL 2 — Básico =================
  add('soma2', 2, 'aritmetica', 'Soma com dezenas', true, (r) => {
    const a = r.int(12, 99), b = r.int(12, 99);
    return { p: 'Quanto é?', x: a + ' + ' + b, a: a + b, e: a + ' + ' + b + ' = ' + (a + b) + '.' };
  });
  add('sub2', 2, 'aritmetica', 'Subtração com dezenas', true, (r) => {
    const a = r.int(30, 150), b = r.int(11, a - 1);
    return { p: 'Quanto é?', x: a + ' ' + M + ' ' + b, a: a - b, e: a + ' ' + M + ' ' + b + ' = ' + (a - b) + '.' };
  });
  add('mult2', 2, 'aritmetica', 'Tabuada', true, (r) => {
    const a = r.int(2, 10), b = r.int(2, 10);
    return { p: 'Quanto é?', x: a + ' × ' + b, a: a * b, e: a + ' × ' + b + ' = ' + a * b + '.' };
  });
  add('div2', 2, 'aritmetica', 'Divisão exata', true, (r) => {
    const b = r.int(2, 10), q = r.int(2, 12);
    return { p: 'Quanto é?', x: b * q + ' ÷ ' + b, a: q, e: b + ' × ' + q + ' = ' + b * q + ', então ' + b * q + ' ÷ ' + b + ' = ' + q + '.' };
  });
  add('mult2b', 2, 'aritmetica', 'Multiplicação por um dígito', true, (r) => {
    let a; do { a = r.int(11, 29); } while (a % 10 === 0);
    const b = r.int(2, 9);
    const d = Math.floor(a / 10) * 10, u = a % 10;
    return { p: 'Quanto é?', x: a + ' × ' + b, a: a * b, e: 'Separe em ' + d + ' × ' + b + ' + ' + u + ' × ' + b + ' = ' + d * b + ' + ' + u * b + ' = ' + a * b + '.' };
  });
  add('ret2', 2, 'geometria', 'Área e perímetro', false, (r) => {
    const a = r.int(3, 12), b = r.int(2, 9);
    return r.rng() < 0.5
      ? { p: 'Um retângulo tem lados de ' + a + ' cm e ' + b + ' cm. Qual é a área, em cm²?', a: a * b, e: 'Área do retângulo = base × altura = ' + a + ' × ' + b + ' = ' + a * b + ' cm².' }
      : { p: 'Um retângulo tem lados de ' + a + ' cm e ' + b + ' cm. Qual é o perímetro, em cm?', a: 2 * (a + b), e: 'Perímetro = 2 × (' + a + ' + ' + b + ') = ' + 2 * (a + b) + ' cm.' };
  });

  // ================= NÍVEL 3 — Intermediário =================
  add('ordem3', 3, 'aritmetica', 'Ordem das operações', true, (r) => {
    const a = r.int(2, 20), b = r.int(2, 9), c = r.int(2, 9), d = r.int(1, 10);
    const ans = a + b * c - d;
    return { p: 'Quanto é?', x: a + ' + ' + b + ' × ' + c + ' ' + M + ' ' + d, a: ans, e: 'Primeiro a multiplicação: ' + b + ' × ' + c + ' = ' + b * c + '. Depois ' + a + ' + ' + b * c + ' ' + M + ' ' + d + ' = ' + n(ans) + '.' };
  });
  add('neg3', 3, 'aritmetica', 'Números negativos', true, (r) => {
    const a = r.int(2, 15), b = r.int(2, 12), c = r.int(2, 15);
    const v = r.int(0, 3);
    if (v === 0) return { p: 'Quanto é?', x: M + a + ' + ' + b + ' ' + M + ' ' + c, a: -a + b - c, e: M + a + ' + ' + b + ' = ' + n(b - a) + '; depois ' + n(b - a) + ' ' + M + ' ' + c + ' = ' + n(b - a - c) + '.' };
    if (v === 1) return { p: 'Quanto é?', x: '(' + M + a + ') × ' + b, a: -a * b, e: 'Sinais diferentes dão resultado negativo: ' + n(-a * b) + '.' };
    if (v === 2) return { p: 'Quanto é?', x: '(' + M + a + ') × (' + M + b + ')', a: a * b, e: 'Sinais iguais dão resultado positivo: ' + a * b + '.' };
    return { p: 'Quanto é?', x: a + ' ' + M + ' (' + M + b + ')', a: a + b, e: 'Subtrair um negativo é somar: ' + a + ' + ' + b + ' = ' + (a + b) + '.' };
  });
  add('frac3', 3, 'fracoes', 'Fração de uma quantidade', true, (r) => {
    const d = r.int(2, 8), nu = r.int(1, d - 1), k = r.int(2, 12);
    return { p: 'Quanto é ' + nu + '/' + d + ' de ' + d * k + '?', a: nu * k, e: d * k + ' ÷ ' + d + ' = ' + k + '; vezes ' + nu + ' dá ' + nu * k + '.' };
  });
  add('perc3', 3, 'fracoes', 'Porcentagem', true, (r) => {
    const p = r.pick([5, 10, 15, 20, 25, 30, 40, 50, 75]), v = 20 * r.int(1, 20);
    return { p: 'Quanto é ' + p + '% de ' + v + '?', a: (p * v) / 100, e: p + '% = ' + p + '/100. ' + v + ' × ' + p + ' ÷ 100 = ' + (p * v) / 100 + '.' };
  });
  add('pot3', 3, 'aritmetica', 'Potências', true, (r) => {
    const v = r.int(0, 2);
    if (v === 0) { const a = r.int(4, 15); return { p: 'Quanto é?', x: a + sup(2), a: a * a, e: a + ' × ' + a + ' = ' + a * a + '.' }; }
    if (v === 1) { const a = r.int(2, 6); return { p: 'Quanto é?', x: a + sup(3), a: a * a * a, e: a + ' × ' + a + ' × ' + a + ' = ' + a * a * a + '.' }; }
    const e = r.int(4, 10);
    return { p: 'Quanto é?', x: '2' + sup(e), a: Math.pow(2, e), e: 'Dobrando ' + e + ' vezes a partir de 1: ' + Math.pow(2, e) + '.' };
  });
  add('raiz3', 3, 'aritmetica', 'Raiz quadrada', true, (r) => {
    const k = r.int(4, 20);
    return { p: 'Quanto é?', x: '√' + k * k, a: k, e: k + ' × ' + k + ' = ' + k * k + ', então √' + k * k + ' = ' + k + '.' };
  });
  add('media3', 3, 'aritmetica', 'Média aritmética', false, (r) => {
    const m = r.int(10, 40), d = [r.int(-3, 3), r.int(-3, 3), r.int(-3, 3)];
    d.push(-(d[0] + d[1] + d[2]));
    const v = d.map((x) => m + x);
    return { p: 'Qual é a média aritmética de ' + v.slice(0, 3).join(', ') + ' e ' + v[3] + '?', a: m, e: 'Soma = ' + 4 * m + '; dividida por 4 dá ' + m + '.' };
  });
  add('tri3', 3, 'geometria', 'Triângulos', false, (r) => {
    if (r.rng() < 0.5) {
      const b = 2 * r.int(2, 10), h = r.int(3, 12);
      return { p: 'Um triângulo tem base ' + b + ' cm e altura ' + h + ' cm. Qual é a área, em cm²?', a: (b * h) / 2, e: 'Área = base × altura ÷ 2 = ' + b + ' × ' + h + ' ÷ 2 = ' + (b * h) / 2 + ' cm².' };
    }
    const a = r.int(30, 80), b = r.int(20, 150 - a);
    return { p: 'Dois ângulos de um triângulo medem ' + a + '° e ' + b + '°. Quanto mede o terceiro, em graus?', a: 180 - a - b, e: 'Os ângulos internos somam 180°: 180 ' + M + ' ' + a + ' ' + M + ' ' + b + ' = ' + (180 - a - b) + '°.' };
  });

  // ================= NÍVEL 4 — Avançado =================
  add('eq4', 4, 'algebra', 'Equação do 1º grau', true, (r) => {
    const a = r.int(2, 9), x = r.nz(-9, 12), b = r.nz(-20, 20), c = a * x + b;
    return { p: 'Resolva. Quanto vale x?', x: lin(a, b) + ' = ' + n(c), a: x, e: a + 'x = ' + n(c) + (b < 0 ? ' + ' : ' ' + M + ' ') + Math.abs(b) + ' = ' + n(c - b) + ', então x = ' + n(x) + '.' };
  });
  add('eq4b', 4, 'algebra', 'Equação com x dos dois lados', false, (r) => {
    const a = r.int(4, 9), c = r.int(1, a - 2), x = r.nz(-8, 10), b = r.nz(-15, 15), d = (a - c) * x + b;
    return { p: 'Resolva. Quanto vale x?', x: lin(a, b) + ' = ' + lin(c, d), a: x, e: 'Juntando os termos: ' + (a - c) + 'x = ' + n(d - b) + ', então x = ' + n(x) + '.' };
  });
  add('prop4', 4, 'fracoes', 'Regra de três', false, (r) => {
    const u = r.int(2, 15), n1 = r.int(2, 9);
    let n2; do { n2 = r.int(3, 15); } while (n2 === n1);
    return { p: 'Se ' + n1 + ' ingressos custam R$ ' + u * n1 + ', quanto custam ' + n2 + ' ingressos, em reais?', a: u * n2, e: 'Cada ingresso custa ' + u * n1 + ' ÷ ' + n1 + ' = R$ ' + u + '. Então ' + n2 + ' × ' + u + ' = R$ ' + u * n2 + '.' };
  });
  add('mmc4', 4, 'numeros', 'MMC e MDC', false, (r) => {
    const g = r.int(2, 6);
    let m, k; do { m = r.int(2, 7); k = r.int(2, 7); } while (m === k || gcd(m, k) !== 1);
    const a = g * m, b = g * k;
    return r.rng() < 0.5
      ? { p: 'Qual é o MMC de ' + a + ' e ' + b + '?', a: g * m * k, e: 'MDC = ' + g + '. MMC = ' + a + ' × ' + b + ' ÷ ' + g + ' = ' + g * m * k + '.' }
      : { p: 'Qual é o MDC de ' + a + ' e ' + b + '?', a: g, e: a + ' = ' + g + ' × ' + m + ' e ' + b + ' = ' + g + ' × ' + k + '; ' + m + ' e ' + k + ' não têm fator comum.' };
  });
  add('pit4', 4, 'geometria', 'Teorema de Pitágoras', false, (r) => {
    const t = r.pick(TRIPLES), k = r.int(1, 3), a = t[0] * k, b = t[1] * k, c = t[2] * k;
    return r.rng() < 0.6
      ? { p: 'Os catetos de um triângulo retângulo medem ' + a + ' e ' + b + '. Quanto mede a hipotenusa?', a: c, e: a + '² + ' + b + '² = ' + (a * a + b * b) + ' = ' + c + '².' }
      : { p: 'A hipotenusa de um triângulo retângulo mede ' + c + ' e um cateto mede ' + a + '. Quanto mede o outro cateto?', a: b, e: c + '² ' + M + ' ' + a + '² = ' + (c * c - a * a) + ' = ' + b + '².' };
  });
  add('sist4', 4, 'algebra', 'Sistema de equações', false, (r) => {
    const x = r.int(-5, 15), y = r.int(-5, 15);
    return { p: 'No sistema abaixo, quanto vale x?', x: 'x + y = ' + n(x + y) + '<br>x ' + M + ' y = ' + n(x - y), a: x, e: 'Somando as duas equações: 2x = ' + n(2 * x) + ', então x = ' + n(x) + ' (e y = ' + n(y) + ').' };
  });
  add('fsoma4', 4, 'fracoes', 'Soma de frações', false, (r) => {
    let b, d; do { b = r.int(2, 8); d = r.int(2, 8); } while (b === d);
    const a = r.int(1, b - 1), c = r.int(1, d - 1), num = a * d + c * b, den = b * d;
    return {
      p: 'Quanto é? Dê a resposta simplificada.', x: a + '/' + b + ' + ' + c + '/' + d,
      o: options(frac(num, den), [frac(a + c, b + d), frac(a * c, den), frac(a + c, den), frac(num, b + d), frac(num + 1, den), frac(num - 1, den), frac(num + 2, den)]),
      e: 'Denominador comum ' + den + ': ' + a * d + '/' + den + ' + ' + c * b + '/' + den + ' = ' + num + '/' + den + (frac(num, den) !== num + '/' + den ? ' = ' + frac(num, den) : '') + '.'
    };
  });
  add('pvar4', 4, 'fracoes', 'Aumentos e descontos', false, (r) => {
    const P = 20 * r.int(2, 40), p = r.pick([5, 10, 15, 20, 25, 30, 40, 50]), up = r.rng() < 0.5;
    const delta = (P * p) / 100, ans = up ? P + delta : P - delta;
    return { p: 'Um produto de R$ ' + P + ' teve ' + (up ? 'aumento' : 'desconto') + ' de ' + p + '%. Qual é o novo preço, em reais?', a: ans, e: p + '% de ' + P + ' = ' + delta + '. ' + P + (up ? ' + ' : ' ' + M + ' ') + delta + ' = ' + ans + '.' };
  });

  // ================= NÍVEL 5 — Especialista =================
  add('quad5', 5, 'algebra', 'Equação do 2º grau', false, (r) => {
    let r1, r2; do { r1 = r.nz(-9, 9); r2 = r.nz(-9, 9); } while (r1 === r2);
    const S = r1 + r2, P = r1 * r2, lo = Math.min(r1, r2), hi = Math.max(r1, r2);
    return { p: 'Qual é a maior raiz da equação?', x: poly([[1, 2], [-S, 1], [P, 0]]) + ' = 0', a: hi, e: 'As raízes somam ' + n(S) + ' e têm produto ' + n(P) + ': são ' + n(lo) + ' e ' + n(hi) + '.' };
  });
  add('log5', 5, 'funcoes', 'Logaritmos', true, (r) => {
    const b = r.pick([2, 3, 5, 10]);
    const k = b === 2 ? r.int(3, 10) : b === 3 ? r.int(2, 5) : b === 5 ? r.int(2, 4) : r.int(2, 6);
    return { p: 'Quanto vale?', x: 'log' + sub(b) + ' ' + Math.pow(b, k), a: k, e: b + sup(k) + ' = ' + Math.pow(b, k) + ', então o logaritmo é ' + k + '.' };
  });
  add('pa5', 5, 'funcoes', 'Progressão aritmética', false, (r) => {
    const a1 = r.int(-10, 20), q = r.nz(-6, 9);
    if (r.rng() < 0.5) {
      const k = r.int(8, 30);
      return { p: 'Numa PA de primeiro termo ' + n(a1) + ' e razão ' + n(q) + ', qual é o ' + k + 'º termo?', a: a1 + (k - 1) * q, e: 'aₙ = a₁ + (n ' + M + ' 1)·r = ' + n(a1) + ' + ' + (k - 1) + ' × ' + par(q) + ' = ' + n(a1 + (k - 1) * q) + '.' };
    }
    const k = r.int(5, 20), last = a1 + (k - 1) * q;
    return { p: 'Numa PA de primeiro termo ' + n(a1) + ' e razão ' + n(q) + ', qual é a soma dos ' + k + ' primeiros termos?', a: (k * (a1 + last)) / 2, e: 'O ' + k + 'º termo é ' + n(last) + '. Soma = ' + k + ' × (' + n(a1) + ' + ' + par(last) + ') ÷ 2 = ' + n((k * (a1 + last)) / 2) + '.' };
  });
  add('pg5', 5, 'funcoes', 'Progressão geométrica', false, (r) => {
    const a1 = r.int(1, 5), q = r.pick([2, 3, -2]), k = r.int(4, 8), ans = a1 * Math.pow(q, k - 1);
    return { p: 'Numa PG de primeiro termo ' + a1 + ' e razão ' + n(q) + ', qual é o ' + k + 'º termo?', a: ans, e: 'aₙ = a₁ · q' + sup('n' + M + '1') + ' = ' + a1 + ' × ' + par(q) + sup(k - 1) + ' = ' + n(ans) + '.' };
  });
  add('comb5', 5, 'contagem', 'Combinações e anagramas', false, (r) => {
    if (r.rng() < 0.5) {
      const k = r.int(2, 4), nn = r.int(k + 2, 10);

  function spark(track) {
    const pts = S.hist[track];
    let h = '<div class="chart"><h3>' + TRACK[track] + ' <span>' + S.r[track] + ' · ' + LV[band(S.r[track])] + '</span></h3>';
    if (pts.length < 2) return h + '<p class="empty">Conclua dois treinos nesta trilha para ver a curva.</p></div>';
    const W = 300, H = 90, lo = Math.min.apply(null, pts) - 40, hi = Math.max.apply(null, pts) + 40;
    const X = (i) => 6 + i * (W - 12) / (pts.length - 1), Y = (v) => H - 8 - (v - lo) / (hi - lo) * (H - 16);
    const line = pts.map((v, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    h += '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução em ' + TRACK[track] + ': de ' + pts[0] + ' para ' + pts[pts.length - 1] + ' em ' + pts.length + ' sessões.">' +
      '<path d="' + line + ' L' + X(pts.length - 1).toFixed(1) + ' ' + H + ' L6 ' + H + ' Z" fill="var(--blue-soft)" stroke="none"/>' +
      '<path d="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      pts.map((v, i) => '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(v).toFixed(1) + '" r="' + (i === pts.length - 1 ? 4.5 : 7) + '" fill="' + (i === pts.length - 1 ? 'var(--blue)' : 'transparent') + '" stroke="' + (i === pts.length - 1 ? 'var(--surface)' : 'none') + '" stroke-width="2"><title>Sessão ' + (i + 1) + ': ' + v + '</title></circle>').join('') +
      '</svg><div class="axis"><span>início ' + pts[0] + '</span><span>' + pts.length + ' sessões</span><span>agora ' + pts[pts.length - 1] + '</span></div></div>';
    return h;
  }
  function activity() {
    const days = [];
    for (let i = 13; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push({ d: d, v: (S.days[dayKey(d)] || { n: 0 }).n }); }
    const max = Math.max(1, Math.max.apply(null, days.map((x) => x.v)));

      days.map((x) => '<i class="' + (x.v ? '' : 'zero') + '" style="height:' + (x.v / max * 100) + '%" data-tip="' + x.d.getDate() + '/' + (x.d.getMonth() + 1) + ': ' + x.v + '"></i>').join('') +
      '</div><div class="axis"><span>' + days[0].d.getDate() + '/' + (days[0].d.getMonth() + 1) + '</span><span>máx. ' + max + '</span><span>hoje</span></div></div>';
  }
  function renderProgress() {

      '<div class="tile"><span>Maior sequência</span><b>' + S.best.combo + '</b><small>acertos seguidos</small></div>' +
      '<div class="tile"><span>Experiência</span><b>' + S.xp + '</b><small>nível ' + xpLevel() + ' · próximo em ' + (50 * xpLevel() * xpLevel()) + '</small></div></div></section>';

    h += '<section class="section"><div class="resetbox">' + (confirmReset

    return h;

  // ---------- bloco de anotações (texto ou à mão) ----------
  const NK = 'sinapse.notas';
  let N = { text: '', tab: 'texto', img: '' };
  try { N = Object.assign(N, JSON.parse(localStorage.getItem(NK) || '{}')); } catch (e) { /* sem armazenamento */ }
  function saveNotes() { try { localStorage.setItem(NK, JSON.stringify(N)); } catch (e) { /* desenho grande demais ou sem armazenamento */ } }
  const nBox = $('#notes'), nFab = $('#notes-fab'), nText = $('#notes-text'), cv = $('#notes-canvas');
  let tool = 'pen', drawing = false, lastPt = null;
  function fitCanvas() {
    const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    const w = Math.round(r.width * dpr), hgt = Math.round(r.height * dpr);
    if (!w || (cv.width === w && cv.height === hgt)) return;
    cv.width = w; cv.height = hgt;
    if (N.img) { const im = new Image(); im.onload = () => cv.getContext('2d').drawImage(im, 0, 0, w, hgt); im.src = N.img; }
  }
  function renderNotes() {
    const draw = N.tab === 'desenho';
    nText.hidden = draw; cv.hidden = !draw; $('#notes-tools').hidden = !draw;
    $('#notes-info').textContent = draw ? 'Use o dedo, a caneta ou o mouse.' : '';
    nBox.querySelectorAll('[data-tab]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tab === N.tab)));
    nBox.querySelectorAll('[data-tool]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.tool === tool)));
    if (draw) fitCanvas();
  }
  function toggleNotes(open) {
    nBox.hidden = !open; nFab.hidden = open; nFab.setAttribute('aria-expanded', String(open));
    if (open) { renderNotes(); if (N.tab === 'texto') nText.focus(); } else nFab.focus();
  }
  function notesAct(a, d) {
    if (a === 'notes') return toggleNotes(true);
    if (a === 'notes-close') return toggleNotes(false);
    if (a === 'notes-tab') { N.tab = d.tab; saveNotes(); renderNotes(); if (N.tab === 'texto') nText.focus(); }
    else if (a === 'notes-tool') { tool = d.tool; renderNotes(); }
    else if (a === 'notes-clear') {
      if (N.tab === 'texto') { N.text = ''; nText.value = ''; nText.focus(); }
      else { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); N.img = ''; }
      saveNotes(); toast(N.tab === 'texto' ? 'Texto apagado' : 'Desenho apagado');
    }
  }
  const penPoint = (e) => { const r = cv.getBoundingClientRect(), k = cv.width / r.width; return { x: (e.clientX - r.left) * k, y: (e.clientY - r.top) * k }; };
  function stroke(p, q) {
    const c = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
    c.globalCompositeOperation = tool === 'eraser' ? 'destination-out' : 'source-over';
    c.strokeStyle = getComputedStyle(cv).color; c.lineWidth = (tool === 'eraser' ? 20 : 2.4) * dpr; c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(q.x, q.y); c.stroke();
  }
  cv.addEventListener('pointerdown', (e) => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* ok */ } drawing = true; lastPt = penPoint(e); stroke(lastPt, lastPt); });
  cv.addEventListener('pointermove', (e) => { if (!drawing) return; const p = penPoint(e); stroke(lastPt, p); lastPt = p; });
  const penUp = () => { if (!drawing) return; drawing = false; try { N.img = cv.toDataURL('image/png'); } catch (x) { /* ok */ } saveNotes(); };
  cv.addEventListener('pointerup', penUp); cv.addEventListener('pointercancel', penUp);
  nText.value = N.text;
  nText.addEventListener('input', () => { N.text = nText.value; saveNotes(); });
  window.addEventListener('resize', () => { if (!nBox.hidden && N.tab === 'desenho') fitCanvas(); });

  // ---------- eventos ----------
  function key(k) {
    if (!ses || ses.fb || ses.done || ses.q.type !== 'num') return;
    if (k === 'enter') return submit(ses.buf);
    if (k === 'back') ses.buf = ses.buf.slice(0, -1);
    else if (k === '-') ses.buf = ses.buf[0] === '-' ? ses.buf.slice(1) : '-' + ses.buf;
    else if (ses.buf.replace('-', '').length < 8) ses.buf += k;
    render();
  }
  document.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const a = el.dataset.act, d = el.dataset;
    if (a.indexOf('notes') === 0) return notesAct(a, d);
    if (a === 'start') start({ mode: d.mode, track: d.track, level: d.level, skill: d.skill, cat: d.cat, gen: d.gen });
    else if (a === 'track') { S.track = d.track; save(); render(); }
    else if (a === 'setstart') { S.r.math = S.r.gk = Number(d.r); save(); render(); }
    else if (a === 'opt') submit(Number(d.i));
    else if (a === 'key') key(d.k);
    else if (a === 'hint') { ses.hint = true; render(); }
    else if (a === 'next') { ses.i++; advance(); }
    else if (a === 'quit') { if (ses.log.length && ses.mode !== 'revisao') finish(); else { stopTimer(); ses = null; render(); } }
    else if (a === 'again') start({ mode: ses.mode, track: ses.track, level: ses.level, skill: ses.skill, cat: ses.cat, gen: ses.gen });
    else if (a === 'home') { ses = null; render(); window.scrollTo(0, 0); }
    else if (a === 'sound') { S.sound = !S.sound; save(); render(); }
    else if (a === 'reset-ask') { confirmReset = true; render(); }
    else if (a === 'reset-no') { confirmReset = false; render(); }
    else if (a === 'reset-yes') { S = fresh(); confirmReset = false; save(); render(); toast('Progresso apagado'); }
    else if (a === 'share') {
      const txt = 'Sinapse · Desafio do dia ' + new Date().toLocaleDateString('pt-BR') + ': ' + ses.okN + '/' + ses.log.length + ' ' + ses.log.map((l) => (l.ok ? '🟩' : '🟥')).join('');
      try { navigator.clipboard.writeText(txt).then(() => toast('Resultado copiado'), () => toast(txt)); } catch (e) { toast(txt); }
    }
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && !nBox.hidden) { toggleNotes(false); return; }
    if (ev.target.closest && ev.target.closest('textarea, input, .notes')) return;
    if (!ses || ses.done || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    const k = ev.key;
    if (ses.fb) { if (k === 'Enter' || k === ' ') { ev.preventDefault(); ses.i++; advance(); } return; }
    if ((k === 'd' || k === 'D') && ses.q.h && !ses.hint) { ev.preventDefault(); ses.hint = true; render(); return; }
    if (ses.q.type === 'mc') { if (k >= '1' && k <= '4') { ev.preventDefault(); submit(Number(k) - 1); } return; }
    if (k >= '0' && k <= '9') { ev.preventDefault(); key(k); }
    else if (k === '-') { ev.preventDefault(); key('-'); }
    else if (k === 'Backspace') { ev.preventDefault(); key('back'); }
    else if (k === 'Enter') { ev.preventDefault(); key('enter'); }
  });
  window.addEventListener('hashchange', () => { if (ses && !ses.done) return; ses = null; confirmReset = false; render(); });

  render();
})();
</script>
</body>
</html>
