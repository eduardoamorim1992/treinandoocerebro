<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Sinapse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>/* Conceito: instrumento de medição. Superfícies limpas, tinta azul-marinho, um azul de ação
   e o amarelo de marca-texto reservado para "onde você está". A régua de 0 a 2800 é a assinatura. */
:root {
  --paper: #F5F6FA;
  --surface: #FFFFFF;
  --sunken: #EEF0F7;
  --ink: #121933;
  --ink-2: #505A7A;
  --line: #DCE0EC;
  --blue: #2443E0;
  --on-blue: #FFFFFF;
  --blue-soft: #E8ECFE;
  --mark: #FFD23F;
  --on-mark: #121933;
  --ok: #0F7A56;
  --ok-bg: #DFF4EB;
  --bad: #BF2F1D;
  --bad-bg: #FCE6E1;
  --shadow: 0 1px 2px rgba(18, 25, 51, 0.05), 0 6px 20px rgba(18, 25, 51, 0.06);
  --sheet: #FFFDF5;
  --sheet-ink: #121933;
  --sheet-rule: rgba(18, 25, 51, 0.09);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
  --r-s: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0C1122; --surface: #151B33; --sunken: #0F1429; --ink: #EEF1FA; --ink-2: #A3ACCB; --line: #29315A;
    --blue: #93A5FF; --on-blue: #0C1122; --blue-soft: #1E2750; --mark: #FFD23F; --on-mark: #121933;
    --ok: #4FD6A6; --ok-bg: #113A2F; --bad: #FF8E7A; --bad-bg: #43201C;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0C1122; --surface: #151B33; --sunken: #0F1429; --ink: #EEF1FA; --ink-2: #A3ACCB; --line: #29315A;
  --blue: #93A5FF; --on-blue: #0C1122; --blue-soft: #1E2750; --mark: #FFD23F; --on-mark: #121933;
  --ok: #4FD6A6; --ok-bg: #113A2F; --bad: #FF8E7A; --bad-bg: #43201C;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--f-body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
p, ul { margin: 0; }
a { color: var(--blue); text-underline-offset: 3px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
kbd { font: 600 11.5px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--ink-2); background: var(--surface); }
.ic { width: 18px; height: 18px; flex: none; }

/* ---------- topo e rodapé ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 8px 22px; flex-wrap: wrap; padding-block: 12px; }
.logo { font: 800 23px/1 var(--f-display); letter-spacing: -0.02em; color: var(--ink); text-decoration: none; }
.logo span { background: var(--mark); color: var(--on-mark); padding: 1px 5px; margin-left: 1px; border-radius: 4px; }
.tabs { display: flex; gap: 2px; }
.tabs a { padding: 7px 13px; border-radius: var(--r-s); color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: 15px; }
.tabs a:hover { color: var(--ink); background: var(--sunken); }
.tabs a[aria-current="page"] { color: var(--blue); background: var(--blue-soft); }
.chips { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip b { font-family: var(--f-mono); }
button.chip:hover { border-color: var(--ink-2); }
.foot { display: flex; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; padding-block: 28px 40px; margin-top: 24px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 13.5px; }
.foot span:first-child { font: 700 15px var(--f-display); color: var(--ink); }

/* ---------- botões ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 10px 16px; font-weight: 600; line-height: 1.2; transition: transform 0.08s ease, border-color 0.12s ease, box-shadow 0.12s ease; }
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--on-blue); box-shadow: 0 1px 2px rgba(18, 25, 51, 0.15), 0 4px 12px rgba(36, 67, 224, 0.25); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.big { padding: 13px 22px; font-size: 16.5px; }
.btn.small { padding: 7px 12px; font-size: 13.5px; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--r-s); background: var(--sunken); border: 1px solid var(--line); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 9px 13px; font-weight: 600; font-size: 14.5px; border-radius: 5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(18, 25, 51, 0.14); }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 13px; font-size: 13.5px; font-weight: 600; }
.pill:hover { border-color: var(--ink-2); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }

/* ---------- início ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px 44px; padding-block: 44px 16px; align-items: center; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.35fr) minmax(300px, 0.8fr); } }
.hero h1 { font-size: clamp(36px, 5.6vw, 60px); font-weight: 800; letter-spacing: -0.03em; margin-top: 10px; }
.hero h1 .mono { font-weight: 700; font-size: 0.86em; letter-spacing: -0.04em; word-spacing: -0.35em; color: var(--blue); white-space: nowrap; }
.hero h1 em { font-style: normal; background: var(--mark); color: var(--on-mark); padding: 0 0.14em; border-radius: 6px; }
.hero .lead { max-width: 54ch; color: var(--ink-2); font-size: 17.5px; margin-top: 16px; }
.go { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 26px; }
.startpick { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; font-size: 13.5px; font-weight: 600; color: var(--ink-2); }
.facts { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 26px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-2); font-size: 14px; }
.facts b { color: var(--ink); font-size: 15px; margin-right: 3px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; display: grid; gap: 18px; min-width: 0; }
.prow { display: grid; gap: 7px; }
.prow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 600; }
.prow-top b { font-size: 26px; line-height: 1; font-weight: 700; }
.prow small { color: var(--ink-2); font-size: 13px; }
.pstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.pstats div { display: grid; gap: 1px; }
.pstats b { font-size: 20px; font-weight: 700; }
.pstats span { font-size: 12px; color: var(--ink-2); }
.meter { height: 7px; background: var(--blue-soft); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: 4px; }

.ruler-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px 16px; min-width: 0; }
.ruler { position: relative; margin: 54px 0 48px; height: 30px; border: 1.5px solid var(--ink); border-radius: 4px;
  background-image: repeating-linear-gradient(90deg, var(--ink) 0 1px, transparent 1px calc(100% / 28)), linear-gradient(var(--surface), var(--surface));
  background-size: 100% 9px, 100% 100%; background-repeat: no-repeat; }
.ruler .seg7 { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
.ruler .seg7 span { border-left: 1.5px solid var(--ink); font: 600 11px/1 var(--f-mono); color: var(--ink-2); padding: 14px 0 0 4px; }
.ruler .seg7 span:first-child { border-left: 0; }
.pin { position: absolute; left: var(--p); width: 0; }
.pin::before { content: ""; position: absolute; left: -1.5px; width: 3px; height: 44px; background: var(--blue); }
.pin.up::before { top: -13px; }
.pin.down::before { bottom: -13px; }
.pin.up { top: -8px; }
.pin.down { bottom: -8px; }
.pin i { position: absolute; left: 0; transform: translateX(calc(var(--p) * -1)); font-style: normal; white-space: nowrap; font-size: 12.5px; font-weight: 600; background: var(--blue); color: var(--on-blue); padding: 3px 9px; border-radius: 5px; }
.pin.up i { bottom: 13px; }
.pin.down i { top: 13px; }
.pin.gk::before, .pin.gk i { background: var(--ink); color: var(--paper); }
.ruler-legend { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; color: var(--ink-2); }
.ruler-legend span { padding-left: 4px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 720px) { .ruler-legend { display: none; } }

.section { padding-block: 22px; display: grid; gap: 16px; }
.section > header { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; }
.section h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
.section .hint { color: var(--ink-2); font-size: 14.5px; max-width: 70ch; }
.subhead { font: 600 12px var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }

.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode { text-align: left; display: grid; gap: 6px; align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; transition: border-color 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease; }
.mode:hover:not(:disabled) { border-color: var(--blue); box-shadow: var(--shadow); transform: translateY(-1px); }
.mode:disabled { cursor: default; opacity: 0.55; }
.mode .ico { width: 40px; height: 40px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); display: grid; place-items: center; margin-bottom: 6px; }
.mode .ico .ic { width: 22px; height: 22px; }
.mode h3 { font-size: 18px; font-weight: 700; }
.mode p { color: var(--ink-2); font-size: 14.5px; }
.mode .stat { font: 600 12.5px var(--f-mono); color: var(--ink); margin-top: 6px; }

.ladder { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.rung { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.rung:first-child { border-top: 0; }
.rung:hover { background: var(--sunken); }
.rung .n, .lvhead .n { font: 700 16px/1 var(--f-mono); color: var(--ink-2); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; background: var(--sunken); border: 1px solid var(--line); }
.rung.here .n { color: var(--on-mark); background: var(--mark); border-color: var(--mark); }
.rung h3 { font-size: 16.5px; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.rung h3 small { font: 500 12px var(--f-mono); color: var(--ink-2); }
.rung .topics { color: var(--ink-2); font-size: 13.5px; margin-top: 2px; }
.rung .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font: 600 10.5px/1 var(--f-body); letter-spacing: 0.05em; text-transform: uppercase; background: var(--blue-soft); color: var(--blue); border-radius: 99px; padding: 4px 8px; }
@media (max-width: 620px) { .rung { grid-template-columns: 40px minmax(0, 1fr); } .rung .acts { grid-column: 2; } }

.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.theme { text-align: left; display: grid; gap: 9px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; transition: border-color 0.12s ease, box-shadow 0.12s ease; }
.theme:hover { border-color: var(--blue); box-shadow: var(--shadow); }
.theme .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.theme .t b { font-weight: 600; }
.theme .t span { font: 600 13px var(--f-mono); color: var(--ink-2); white-space: nowrap; }
.theme small { color: var(--ink-2); font-size: 12.5px; }

/* ---------- fórmulas ---------- */
.lvhead { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; margin-top: 14px; }
.formulas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.formula { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; align-content: start; grid-template-rows: auto 1fr auto; min-width: 0; }
.formula header { display: grid; gap: 1px; }
.formula header b { font: 700 16px var(--f-display); }
.formula header small { color: var(--ink-2); font-size: 12.5px; }
.fx { font: 500 14px/1.6 var(--f-mono); background: var(--sunken); border-radius: var(--r-s); padding: 10px 12px; overflow-wrap: anywhere; }
.fx sup, .fx sub, .hintbox sup, .hintbox sub { font-size: 0.72em; }

/* ---------- sessão ---------- */
.ses { max-width: 740px; margin: 0 auto; padding-block: 28px; display: grid; gap: 16px; }
.ses-head { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
.ses-head .where { font: 700 18px var(--f-display); min-width: 0; }
.ses-head .where small { display: block; color: var(--ink-2); font: 500 13px var(--f-body); margin-top: 2px; }
.ses-head .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.dots { display: flex; gap: 4px; }
.dots i { flex: 1; max-width: 64px; height: 5px; border-radius: 3px; background: var(--line); }
.dots i.ok { background: var(--ok); }
.dots i.bad { background: var(--bad); }
.dots i.now { background: var(--ink); }
.timebar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--mark); width: 100%; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: clamp(20px, 4.5vw, 36px); display: grid; gap: 22px; }
.card.flash-ok { border-color: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.card.flash-bad { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.q-p { font-size: 17px; font-weight: 500; color: var(--ink-2); text-wrap: pretty; }
.q-p.solo { font: 600 clamp(21px, 3.6vw, 27px)/1.25 var(--f-display); color: var(--ink); }
.q-x { font: 600 clamp(26px, 6.2vw, 42px)/1.35 var(--f-mono); overflow-x: auto; padding-block: 4px; }
.q-x sup, .q-x sub, .fb sup, .fb sub { font-size: 0.6em; }
.mx { display: inline-grid; grid-template-columns: repeat(var(--n), auto); gap: 4px 18px; padding: 4px 12px; border-left: 2.5px solid currentColor; border-right: 2.5px solid currentColor; border-radius: 6px; text-align: right; vertical-align: middle; font-size: 0.8em; }
.mx i { font-style: normal; }
.int { display: inline-flex; align-items: center; font-size: 1.25em; }
.int .lims { display: inline-flex; flex-direction: column; font-size: 0.42em; line-height: 1.3; margin-left: 2px; }
.int .lims sup, .int .lims sub { font-size: 1em; position: static; }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .opts { grid-template-columns: minmax(0, 1fr); } }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 15px; font-weight: 500; min-width: 0; overflow-wrap: anywhere; transition: border-color 0.1s ease, background 0.1s ease; }
.opt kbd { flex: none; }
.opt:hover:not(:disabled) { border-color: var(--blue); background: var(--blue-soft); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--ok); background: var(--ok-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt.mathopt { font-family: var(--f-mono); font-size: 18px; }

.entry { display: grid; gap: 12px; justify-items: start; }
.display { min-width: 200px; min-height: 60px; border: 1.5px solid var(--ink); border-radius: var(--r); padding: 8px 16px; font: 600 32px/1.25 var(--f-mono); background: var(--sunken); display: flex; align-items: center; }
.display.empty { color: var(--ink-2); font: 400 15px var(--f-body); }
.display .caret { width: 2px; height: 30px; background: var(--blue); margin-left: 3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.keypad { display: grid; grid-template-columns: repeat(6, minmax(0, 54px)); gap: 6px; }
.keypad button { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); height: 48px; font: 600 18px var(--f-mono); }
.keypad button:hover { border-color: var(--ink-2); background: var(--sunken); }
.keypad .okk { grid-column: span 2; background: var(--blue); color: var(--on-blue); border-color: var(--blue); font: 600 15px var(--f-body); }
.keypad .okk:hover { background: var(--blue); filter: brightness(1.07); }

.hintbox { border: 1px solid var(--mark); border-left-width: 4px; background: var(--sunken); border-radius: var(--r-s); padding: 12px 16px; display: grid; gap: 4px; }
.hintbox b { font: 600 12px var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.hintbox p { font: 500 15px/1.6 var(--f-mono); overflow-wrap: anywhere; }
.fb { border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; }
.fb.ok { background: var(--ok-bg); }
.fb.bad { background: var(--bad-bg); }
.fb strong { font: 700 18px var(--f-display); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.fb.ok strong { color: var(--ok); }
.fb.bad strong { color: var(--bad); }
.fb strong small { font: 600 12.5px var(--f-mono); color: var(--ink); }
.fb p { font-size: 15.5px; }
.fb .fline { font-size: 14px; border-top: 1px solid var(--line); padding-top: 8px; overflow-wrap: anywhere; }
.fb-row { display: flex; justify-content: flex-end; }

/* ---------- resultado ---------- */
.result h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 800; letter-spacing: -0.03em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 3px; }
.tile span { font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.tile b { font: 700 28px/1.2 var(--f-mono); }
.tile small { font-size: 12.5px; color: var(--ink-2); }
.up { color: var(--ok); } .down { color: var(--bad); }
.review { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.review li { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 4px 10px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 14.5px; }
.review li:first-child { border-top: 0; }
.review .ic { font: 700 15px var(--f-mono); width: auto; height: auto; }
.review .ic.ok { color: var(--ok); } .review .ic.bad { color: var(--bad); }
.review .qx { font-family: var(--f-mono); }
.review small { color: var(--ink-2); grid-column: 2; }
.newach { background: var(--mark); color: var(--on-mark); border-radius: var(--r); padding: 13px 18px; font-weight: 600; }
.rowbtns { display: flex; gap: 10px; flex-wrap: wrap; }

/* ---------- progresso ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.chart { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 8px; min-width: 0; align-content: start; }
.chart h3 { font-size: 16px; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.chart h3 span { font: 600 12.5px var(--f-mono); color: var(--ink-2); }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .empty { color: var(--ink-2); font-size: 14px; padding-block: 22px; }
.chart .axis { display: flex; justify-content: space-between; font: 500 11.5px var(--f-mono); color: var(--ink-2); }
.bars { display: grid; grid-template-columns: repeat(14, 1fr); gap: 2px; align-items: end; height: 84px; border-bottom: 1px solid var(--line); }
.bars i { background: var(--blue); border-radius: 4px 4px 0 0; min-height: 0; position: relative; }
.bars i.zero { background: var(--line); height: 2px !important; border-radius: 0; }
.bars i:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); font: 500 11.5px var(--f-mono); padding: 3px 7px; border-radius: 4px; white-space: nowrap; z-index: 2; }
.skills { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.skill { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(60px, 1fr) 96px; gap: 12px; align-items: center; padding: 11px 18px; border-top: 1px solid var(--line); font-size: 14.5px; }
.skill:first-child { border-top: 0; }
.skill span:last-child { font: 500 12.5px var(--f-mono); color: var(--ink-2); text-align: right; }
.achs { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.ach { border: 1px dashed var(--line); border-radius: var(--r); padding: 13px 15px; display: grid; gap: 2px; color: var(--ink-2); align-content: start; }
.ach b { font-weight: 600; }
.ach small { font-size: 12.5px; }
.ach.got { border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.ach.got b::before { content: "✓ "; color: var(--ok); }
.resetbox { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--ink-2); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: var(--r-s); font-weight: 600; font-size: 14px; z-index: 20; box-shadow: var(--shadow); }

/* ---------- bloco de anotações ---------- */
.fab { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 99px; padding: 12px 18px; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 14.5px; box-shadow: var(--shadow); }
.fab:hover { filter: brightness(1.15); }
.notes { position: fixed; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; width: min(400px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow), 0 16px 40px rgba(18, 25, 51, 0.18); display: grid; gap: 10px; padding: 12px; }
.notes header, .notes footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.notes header b { font: 700 16px var(--f-display); margin-right: auto; }
.notes .seg button { padding: 6px 11px; font-size: 13.5px; }
.notes textarea, .notes canvas { width: 100%; height: min(260px, 42vh); border: 1px solid var(--line); border-radius: var(--r-s); background: var(--sheet); color: var(--sheet-ink); display: block; }
.notes textarea { resize: none; padding: 12px 14px; font: 500 15px/1.6 var(--f-mono); background-image: linear-gradient(transparent calc(100% - 1px), var(--sheet-rule) 0); background-size: 100% 24px; background-attachment: local; line-height: 24px; }
.notes textarea::placeholder { color: var(--sheet-ink); opacity: 0.5; }
.notes canvas { touch-action: none; cursor: crosshair; }
.notes footer span { font-size: 12.5px; color: var(--ink-2); margin-right: auto; }
.notes footer .btn { margin-left: auto; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<script>window.SINAPSE_BANK=[{"id":"todtie","c":"ciencias","d":1,"q":"Qual planeta é conhecido como Planeta Vermelho?","o":["Marte","Vênus","Júpiter","Saturno"],"e":"A cor avermelhada de Marte vem do óxido de ferro, a mesma substância da ferrugem, que cobre seu solo."},{"id":"1ynksw2","c":"ciencias","d":1,"q":"Qual órgão bombeia o sangue para todo o corpo?","o":["Coração","Pulmão","Fígado","Estômago"],"e":"O coração é um músculo que se contrai sem parar, empurrando o sangue pelas artérias e veias."},{"id":"101cmpy","c":"ciencias","d":1,"q":"Qual gás do ar precisamos respirar para viver?","o":["Oxigênio","Hélio","Neônio","Argônio"],"e":"Nossas células usam o oxigênio para retirar energia dos alimentos; ele forma cerca de um quinto do ar."},{"id":"1o526o3","c":"ciencias","d":1,"q":"Em que a água líquida se transforma quando congela?","o":["Gelo","Vapor","Névoa","Orvalho"],"e":"Ao nível do mar, a água pura passa do estado líquido para o sólido a 0 °C, formando gelo."},{"id":"6xovs2","c":"ciencias","d":1,"q":"Qual é a estrela mais próxima da Terra?","o":["Sol","Sirius","Vega","Polaris"],"e":"O Sol é uma estrela. Sua luz leva cerca de 8 minutos para chegar à Terra."},{"id":"1lls4dq","c":"ciencias","d":1,"q":"Quantas patas tem uma aranha?","o":["Oito","Seis","Dez","Quatro"],"e":"Aranhas são aracnídeos e têm oito patas. Os insetos, como as formigas, têm seis."},{"id":"l8amdh","c":"ciencias","d":1,"q":"Que parte da planta costuma ficar debaixo da terra e absorve água?","o":["Raiz","Folha","Flor","Fruto"],"e":"A raiz fixa a planta no solo e retira dele a água e os sais minerais."},{"id":"12h9n5c","c":"ciencias","d":1,"q":"Que força puxa os objetos em direção ao chão?","o":["Gravidade","Magnetismo","Atrito","Empuxo"],"e":"A gravidade é a atração entre corpos com massa. A Terra, por ser muito massiva, puxa tudo para o seu centro."},{"id":"1s0puf4","c":"ciencias","d":1,"q":"Qual destes animais é um mamífero?","o":["Golfinho","Tubarão","Pinguim","Jacaré"],"e":"O golfinho respira ar pelos pulmões e amamenta os filhotes. Tubarão é peixe, pinguim é ave e jacaré é réptil."},{"id":"u2chjm","c":"ciencias","d":1,"q":"Qual conjunto de ossos protege o cérebro?","o":["Crânio","Costelas","Bacia","Coluna"],"e":"O crânio funciona como um capacete natural. As costelas protegem o coração e os pulmões."},{"id":"tyekff","c":"ciencias","d":2,"q":"Qual é a fórmula química da água?","o":["H2O","CO2","O2","NaCl"],"e":"Cada molécula de água tem dois átomos de hidrogênio ligados a um átomo de oxigênio."},{"id":"fxz1lm","c":"ciencias","d":2,"q":"Como se chama o processo em que as plantas produzem alimento usando a luz?","o":["Fotossíntese","Fermentação","Transpiração","Germinação"],"e":"Na fotossíntese, a planta usa luz, água e gás carbônico para produzir glicose e liberar oxigênio."},{"id":"6bt59y","c":"ciencias","d":2,"q":"Qual é o maior planeta do Sistema Solar?","o":["Júpiter","Saturno","Netuno","Urano"],"e":"Júpiter é um gigante gasoso com massa maior que a de todos os outros planetas do Sistema Solar somados."},{"id":"var5e4","c":"ciencias","d":2,"q":"Quais células do sangue transportam oxigênio?","o":["Hemácias","Leucócitos","Plaquetas","Linfócitos"],"e":"As hemácias contêm hemoglobina, proteína com ferro que se liga ao oxigênio e dá a cor vermelha ao sangue."},{"id":"dm9bu6","c":"ciencias","d":2,"q":"A que temperatura a água pura ferve ao nível do mar?","o":["100 °C","90 °C","80 °C","120 °C"],"e":"Em altitudes elevadas a pressão do ar é menor e a água ferve abaixo de 100 °C."},{"id":"14uraca","c":"ciencias","d":2,"q":"Qual é o gás mais abundante na atmosfera da Terra?","o":["Nitrogênio","Oxigênio","Gás carbônico","Argônio"],"e":"O nitrogênio compõe cerca de 78% do ar; o oxigênio, cerca de 21%."},{"id":"4ngur7","c":"ciencias","d":2,"q":"Qual movimento da Terra é responsável pela sucessão dos dias e das noites?","o":["Rotação","Translação","Precessão","Nutação"],"e":"A Terra gira em torno do próprio eixo em cerca de 24 horas. A translação, ao redor do Sol, dura um ano."},{"id":"bvzzxm","c":"ciencias","d":2,"q":"Como são chamados os animais que se alimentam apenas de plantas?","o":["Herbívoros","Carnívoros","Onívoros","Detritívoros"],"e":"Herbívoros, como bois e coelhos, são consumidores primários nas cadeias alimentares."},{"id":"uz375p","c":"ciencias","d":2,"q":"Como se chama a passagem de uma substância do estado líquido para o gasoso?","o":["Vaporização","Condensação","Solidificação","Fusão"],"e":"A vaporização pode ser lenta (evaporação) ou rápida, com bolhas (ebulição). O inverso é a condensação."},{"id":"uaccb6","c":"ciencias","d":2,"q":"Em qual órgão ocorre a maior parte da absorção dos nutrientes?","o":["Intestino delgado","Intestino grosso","Estômago","Esôfago"],"e":"As vilosidades do intestino delgado aumentam muito a área de absorção. O intestino grosso absorve sobretudo água."},{"id":"qjzvn5","c":"ciencias","d":3,"q":"Qual organela é a principal responsável pela respiração celular aeróbica?","o":["Mitocôndria","Ribossomo","Lisossomo","Centríolo"],"e":"Na mitocôndria ocorre a maior parte da produção de ATP. Ela possui DNA próprio e dupla membrana."},{"id":"wb78m0","c":"ciencias","d":3,"q":"O número atômico de um elemento corresponde ao seu número de quê?","o":["Prótons","Nêutrons","Núcleons","Isótopos"],"e":"O número de prótons define o elemento. Átomos com mesmos prótons e nêutrons diferentes são isótopos."},{"id":"llyril","c":"ciencias","d":3,"q":"Qual é a unidade de força no Sistema Internacional?","o":["Newton","Joule","Watt","Pascal"],"e":"Um newton é a força que dá a 1 kg a aceleração de 1 m/s². Joule mede energia, watt potência e pascal pressão."},{"id":"vuwt4z","c":"ciencias","d":3,"q":"Qual é o pH de uma solução aquosa neutra a 25 °C?","o":["7","0","1","14"],"e":"A escala de pH é logarítmica: abaixo de 7 a solução é ácida e acima de 7 é básica."},{"id":"c0qf9z","c":"ciencias","d":3,"q":"No RNA, qual base nitrogenada ocupa o lugar da timina do DNA?","o":["Uracila","Citosina","Guanina","Adenina"],"e":"No RNA a adenina pareia com a uracila. O RNA também difere do DNA por ter ribose em vez de desoxirribose."},{"id":"191ziv5","c":"ciencias","d":3,"q":"O ano-luz é uma unidade usada para medir o quê?","o":["Distância","Tempo","Velocidade","Luminosidade"],"e":"É a distância que a luz percorre no vácuo em um ano: cerca de 9,46 trilhões de quilômetros."},{"id":"oxhiso","c":"ciencias","d":3,"q":"Que tipo de ligação química se forma pelo compartilhamento de pares de elétrons?","o":["Covalente","Iônica","Metálica","Dipolo-dipolo"],"e":"Na ligação covalente os átomos compartilham elétrons; na iônica há transferência e atração entre íons."},{"id":"1ybsjkn","c":"ciencias","d":3,"q":"Qual é o valor aproximado da velocidade da luz no vácuo?","o":["300.000 km/s","150.000 km/s","30.000 km/s","3.000.000 km/s"],"e":"O valor exato é 299.792.458 m/s, e é a partir dele que o metro é definido."},{"id":"1dsdmzb","c":"ciencias","d":3,"q":"Qual hormônio reduz a concentração de glicose no sangue?","o":["Insulina","Glucagon","Adrenalina","Cortisol"],"e":"A insulina, produzida pelas células beta do pâncreas, faz as células captarem glicose. O glucagon tem efeito oposto."},{"id":"1odnuih","c":"ciencias","d":3,"q":"Com qual planta Gregor Mendel fez os experimentos que fundaram a genética?","o":["Ervilha","Milho","Feijão","Trigo"],"e":"Mendel cruzou ervilhas com características bem distintas, como cor e textura da semente, e deduziu as leis da herança."},{"id":"oy9o7d","c":"ciencias","d":4,"q":"Qual partícula é a mediadora da interação eletromagnética?","o":["Fóton","Glúon","Bóson Z","Píon"],"e":"O fóton não tem massa, por isso o alcance eletromagnético é infinito. O glúon medeia a força forte."},{"id":"6uywze","c":"ciencias","d":4,"q":"Em qual compartimento da célula eucariótica ocorre o ciclo de Krebs?","o":["Matriz mitocondrial","Citosol","Estroma do cloroplasto","Lúmen do retículo"],"e":"A glicólise ocorre no citosol; o piruvato entra na mitocôndria e o ciclo de Krebs acontece na matriz."},{"id":"q92mxp","c":"ciencias","d":4,"q":"Em qual planeta um dia sideral dura mais do que um ano do próprio planeta?","o":["Vênus","Mercúrio","Marte","Urano"],"e":"Vênus leva cerca de 243 dias terrestres para girar sobre si e cerca de 225 para orbitar o Sol, e gira em sentido retrógrado."},{"id":"ewt2jg","c":"ciencias","d":4,"q":"Qual é o elemento mais eletronegativo da tabela periódica?","o":["Flúor","Oxigênio","Cloro","Nitrogênio"],"e":"Na escala de Pauling o flúor tem o valor máximo, 3,98. A eletronegatividade cresce para cima e para a direita."},{"id":"vc4w24","c":"ciencias","d":4,"q":"Que princípio afirma que dois férmions idênticos não podem ocupar o mesmo estado quântico?","o":["Exclusão de Pauli","Incerteza de Heisenberg","Correspondência de Bohr","Equivalência de Einstein"],"e":"O princípio de Pauli explica a estrutura das camadas eletrônicas e, portanto, a tabela periódica."},{"id":"jc32qd","c":"ciencias","d":4,"q":"Qual enzima sintetiza DNA usando uma molécula de RNA como molde?","o":["Transcriptase reversa","RNA polimerase II","DNA ligase","Topoisomerase"],"e":"Retrovírus como o HIV usam a transcriptase reversa para copiar seu genoma de RNA em DNA."},{"id":"162qc69","c":"ciencias","d":4,"q":"Como se chama o limite de massa acima do qual uma anã branca não se sustenta?","o":["Limite de Chandrasekhar","Limite de Roche","Limite de Eddington","Limite de Hayashi"],"e":"Vale cerca de 1,4 massa solar. Acima dele, a pressão de degenerescência dos elétrons não vence a gravidade."},{"id":"nz9dqh","c":"ciencias","d":4,"q":"O nervo vago corresponde a qual par de nervos cranianos?","o":["Décimo","Sétimo","Quinto","Nono"],"e":"O vago (X par) leva fibras parassimpáticas ao coração, pulmões e trato digestivo. O VII é o facial e o V, o trigêmeo."},{"id":"b0g9bd","c":"ciencias","d":4,"q":"Qual é a geometria molecular do metano (CH4)?","o":["Tetraédrica","Piramidal","Trigonal plana","Quadrada plana"],"e":"Os quatro pares ligantes se afastam ao máximo, formando ângulos de 109,5°, típicos da hibridização sp3."},{"id":"22kw56","c":"ciencias","d":4,"q":"Que lei relaciona a velocidade de afastamento das galáxias com a distância até elas?","o":["Lei de Hubble-Lemaître","Lei de Stefan-Boltzmann","Lei de Titius-Bode","Lei de Tully-Fisher"],"e":"Quanto mais distante a galáxia, mais rápido ela se afasta: evidência observacional da expansão do Universo."},{"id":"9w289e","c":"ciencias","d":5,"q":"Qual é o único dos 20 aminoácidos proteicos padrão que não possui carbono quiral?","o":["Glicina","Alanina","Serina","Prolina"],"e":"Na glicina a cadeia lateral é apenas um hidrogênio, então o carbono alfa tem dois ligantes iguais e não é quiral."},{"id":"poxgv0","c":"ciencias","d":5,"q":"Qual é o spin do bóson de Higgs?","o":["0","1/2","1","2"],"e":"O Higgs é a única partícula elementar escalar do Modelo Padrão. Fóton, glúon, W e Z têm spin 1."},{"id":"zdzvet","c":"ciencias","d":5,"q":"Em qual subfase da prófase I da meiose ocorre o crossing-over?","o":["Paquíteno","Leptóteno","Zigóteno","Diplóteno"],"e":"No zigóteno os homólogos se pareiam; no paquíteno há a permuta; no diplóteno os quiasmas ficam visíveis."},{"id":"8iuy4x","c":"ciencias","d":5,"q":"Qual é o valor aproximado da constante de estrutura fina?","o":["1/137","1/1836","1/273","1/42"],"e":"Adimensional, ela mede a intensidade da interação eletromagnética. Já 1836 é a razão entre massas do próton e do elétron."},{"id":"g157rk","c":"ciencias","d":5,"q":"Qual é a configuração eletrônica do cromo (Z = 24) no estado fundamental?","o":["[Ar] 3d5 4s1","[Ar] 3d4 4s2","[Ar] 3d6 4s0","[Ar] 3d3 4s2 4p1"],"e":"O cromo foge da ordem prevista pelo diagrama de Pauling: a configuração com subnível d semipreenchido é mais estável."},{"id":"1xh50xc","c":"ciencias","d":5,"q":"Qual é a classificação espectral do Sol?","o":["G2V","K2V","F5V","G8III"],"e":"G2 indica temperatura superficial próxima de 5.800 K e V indica estrela da sequência principal (anã)."},{"id":"pjaerq","c":"ciencias","d":5,"q":"Por qual abertura do crânio passa o nervo maxilar (V2)?","o":["Forame redondo","Forame oval","Forame espinhoso","Forame jugular"],"e":"Os ramos do trigêmeo saem por: fissura orbital superior (V1), forame redondo (V2) e forame oval (V3)."},{"id":"1gd50rv","c":"ciencias","d":5,"q":"Qual é a temperatura do ponto triplo da água?","o":["273,16 K","273,15 K","272,16 K","277,13 K"],"e":"No ponto triplo coexistem gelo, líquido e vapor, a 0,01 °C. Já 273,15 K corresponde a 0 °C."},{"id":"4vaigq","c":"ciencias","d":5,"q":"Qual processo de fusão domina a produção de energia em estrelas da sequência principal bem mais massivas que o Sol?","o":["Ciclo CNO","Cadeia próton-próton","Processo triplo-alfa","Captura lenta de nêutrons"],"e":"O ciclo CNO usa carbono, nitrogênio e oxigênio como catalisadores e depende muito mais da temperatura que a cadeia pp."},{"id":"1uun8ag","c":"ciencias","d":5,"q":"Como se chama o desdobramento de linhas espectrais causado por um campo magnético externo?","o":["Efeito Zeeman","Efeito Stark","Efeito Raman","Efeito Compton"],"e":"O efeito Stark é o análogo para campos elétricos. O Zeeman permite medir campos magnéticos em manchas solares."},{"id":"1v2798j","c":"tecnologia","d":1,"q":"Qual peça do computador usamos para digitar letras e números?","o":["Teclado","Monitor","Mouse","Alto-falante"],"e":"O teclado é um dispositivo de entrada: cada tecla envia um sinal que o computador transforma em caractere."},{"id":"l2lvlr","c":"tecnologia","d":1,"q":"Como se chama a rede mundial que liga computadores do planeta inteiro?","o":["Internet","Intranet","Bluetooth","Ethernet"],"e":"A internet é uma rede de redes. Intranet é uma rede interna, restrita a uma organização."},{"id":"nd2ls","c":"tecnologia","d":1,"q":"Qual inventor brasileiro voou com o avião 14-Bis em Paris, em 1906?","o":["Santos Dumont","Oswaldo Cruz","Vital Brazil","Carlos Chagas"],"e":"Alberto Santos Dumont voou com o 14-Bis no campo de Bagatelle diante do público e de juízes oficiais."},{"id":"y05ak8","c":"tecnologia","d":1,"q":"Qual máquina voadora tem grandes pás girando em cima e pode ficar parada no ar?","o":["Helicóptero","Planador","Avião a jato","Dirigível"],"e":"O rotor do helicóptero gera sustentação mesmo sem o aparelho avançar, o que permite pairar e subir na vertical."},{"id":"ym76vk","c":"tecnologia","d":1,"q":"De onde vem a energia aproveitada pelos painéis solares?","o":["Da luz do Sol","Do vento","Da água dos rios","Do calor do solo"],"e":"As células fotovoltaicas transformam a luz solar diretamente em eletricidade."},{"id":"tnyky9","c":"tecnologia","d":1,"q":"Qual instrumento serve para observar objetos muito distantes, como planetas?","o":["Telescópio","Microscópio","Periscópio","Estetoscópio"],"e":"O telescópio coleta muita luz e amplia a imagem de objetos distantes. O microscópio amplia coisas minúsculas e próximas."},{"id":"okt6u9","c":"tecnologia","d":1,"q":"Qual destes veículos anda sobre trilhos?","o":["Trem","Ônibus","Caminhão","Balsa"],"e":"As rodas de aço sobre trilhos de aço têm pouco atrito, o que permite ao trem puxar cargas muito pesadas."},{"id":"1ih5780","c":"tecnologia","d":1,"q":"Qual símbolo aparece em todo endereço de e-mail?","o":["@ (arroba)","# (cerquilha)","& (e comercial)","% (porcentagem)"],"e":"A arroba separa o nome do usuário do nome do servidor de e-mail, como em nome@exemplo.com."},{"id":"apha0o","c":"tecnologia","d":1,"q":"O que colocamos em um controle remoto para ele ter energia e funcionar?","o":["Pilhas","Ímãs","Antenas","Lâmpadas"],"e":"As pilhas guardam energia química e a transformam em energia elétrica quando o aparelho é usado."},{"id":"1k05zr7","c":"tecnologia","d":1,"q":"Qual instrumento tem uma agulha que aponta para o norte?","o":["Bússola","Termômetro","Balança","Ampulheta"],"e":"A agulha da bússola é um ímã que se alinha com o campo magnético da Terra."},{"id":"9v824k","c":"tecnologia","d":2,"q":"O que significa a sigla CPU?","o":["Unidade Central de Processamento","Unidade de Controle de Periféricos","Central de Programas do Usuário","Circuito Principal de Utilidades"],"e":"A CPU (Central Processing Unit) executa as instruções dos programas; é o processador do computador."},{"id":"1ne7trf","c":"tecnologia","d":2,"q":"Quem recebeu a patente do telefone nos Estados Unidos em 1876?","o":["Alexander Graham Bell","Thomas Edison","Nikola Tesla","Guglielmo Marconi"],"e":"Bell registrou a patente em 1876. Marconi ficou conhecido pela telegrafia sem fio."},{"id":"1vo52z5","c":"tecnologia","d":2,"q":"Qual sistema numérico, formado só por 0 e 1, é a base dos computadores?","o":["Binário","Decimal","Octal","Hexadecimal"],"e":"Os circuitos têm dois estados (ligado e desligado), representados naturalmente pelos dígitos 0 e 1."},{"id":"2r7hyo","c":"tecnologia","d":2,"q":"Quem desenvolveu a prensa de tipos móveis na Europa do século XV?","o":["Johannes Gutenberg","Leonardo da Vinci","Galileu Galilei","Nicolau Copérnico"],"e":"A prensa de Gutenberg barateou a produção de livros e acelerou a circulação de ideias na Europa."},{"id":"16srvrt","c":"tecnologia","d":2,"q":"Quantos bits formam um byte?","o":["Oito","Quatro","Dez","Dezesseis"],"e":"Com 8 bits é possível representar 256 valores diferentes, de 0 a 255."},{"id":"1kovu9v","c":"tecnologia","d":2,"q":"Qual empresa criou o sistema operacional Windows?","o":["Microsoft","Apple","IBM","Google"],"e":"A Microsoft lançou o Windows em 1985 como interface gráfica para o MS-DOS."},{"id":"7hs5qe","c":"tecnologia","d":2,"q":"Qual máquina impulsionou as fábricas e os trens na Primeira Revolução Industrial?","o":["Máquina a vapor","Motor elétrico","Motor a diesel","Turbina a gás"],"e":"Aperfeiçoada por James Watt no século XVIII, a máquina a vapor transforma o calor da queima do carvão em movimento."},{"id":"9cv1sj","c":"tecnologia","d":2,"q":"Que tipo de programa é usado para abrir e visitar páginas da web?","o":["Navegador","Antivírus","Compilador","Planilha"],"e":"O navegador pede as páginas a servidores e interpreta o código HTML, CSS e JavaScript para exibi-las."},{"id":"d8ctuh","c":"tecnologia","d":2,"q":"O GPS calcula a posição do aparelho usando sinais vindos de onde?","o":["Satélites","Torres de rádio","Cabos submarinos","Radares em solo"],"e":"O receptor mede o tempo de chegada dos sinais de vários satélites e, com isso, calcula sua posição."},{"id":"qgmkq0","c":"tecnologia","d":2,"q":"Qual elemento químico é a principal matéria-prima dos chips de computador?","o":["Silício","Cobre","Alumínio","Chumbo"],"e":"O silício é um semicondutor: sua condutividade pode ser controlada, o que permite fabricar transistores."},{"id":"15ljq5t","c":"tecnologia","d":3,"q":"O que significa a sigla HTML?","o":["HyperText Markup Language","HyperText Machine Language","HighText Markup Language","HyperTransfer Markup Language"],"e":"HTML é uma linguagem de marcação, não de programação: descreve a estrutura das páginas com etiquetas (tags)."},{"id":"oxcb7e","c":"tecnologia","d":3,"q":"Quem criou a World Wide Web no CERN, por volta de 1989-1990?","o":["Tim Berners-Lee","Vint Cerf","Linus Torvalds","Dennis Ritchie"],"e":"Berners-Lee criou o HTML, o HTTP e o primeiro navegador. Vint Cerf é um dos autores do TCP/IP, base da internet."},{"id":"10zdxmh","c":"tecnologia","d":3,"q":"Qual sistema traduz nomes de domínio, como exemplo.com, em endereços IP?","o":["DNS","DHCP","FTP","SMTP"],"e":"O DNS funciona como uma lista telefônica da internet. O DHCP distribui endereços IP dentro de uma rede."},{"id":"fwas8m","c":"tecnologia","d":3,"q":"Quem criou o núcleo (kernel) do sistema operacional Linux em 1991?","o":["Linus Torvalds","Richard Stallman","Ken Thompson","Bill Joy"],"e":"Torvalds lançou o kernel quando era estudante na Finlândia. Stallman fundou o projeto GNU, que forneceu as ferramentas."},{"id":"1nrbq4p","c":"tecnologia","d":3,"q":"Qual tipo de memória do computador perde seu conteúdo quando a energia é desligada?","o":["RAM","ROM","SSD","HD"],"e":"A RAM é volátil e serve de área de trabalho rápida. SSD, HD e ROM mantêm os dados sem energia."},{"id":"1jehfcm","c":"tecnologia","d":3,"q":"Qual é o valor decimal do número binário 1010?","o":["10","8","12","5"],"e":"Da direita para a esquerda os bits valem 1, 2, 4 e 8. Em 1010 estão ligados o 8 e o 2: 8 + 2 = 10."},{"id":"e8iqln","c":"tecnologia","d":3,"q":"Qual liga metálica é formada basicamente por ferro e carbono?","o":["Aço","Bronze","Latão","Duralumínio"],"e":"Bronze é cobre com estanho e latão é cobre com zinco. No aço, o carbono aumenta a dureza do ferro."},{"id":"1fsjqq3","c":"tecnologia","d":3,"q":"Quem inventou a dinamite, patenteada em 1867?","o":["Alfred Nobel","Michael Faraday","Antoine Lavoisier","Humphry Davy"],"e":"Nobel estabilizou a nitroglicerina com um material absorvente. Sua fortuna financiou os prêmios que levam seu nome."},{"id":"1srnd2p","c":"tecnologia","d":3,"q":"Qual foi o primeiro satélite artificial colocado em órbita, em 1957?","o":["Sputnik 1","Explorer 1","Vostok 1","Telstar 1"],"e":"Lançado pela União Soviética, o Sputnik 1 marcou o início da era espacial. O Explorer 1, dos EUA, veio em 1958."},{"id":"1w9h91e","c":"tecnologia","d":3,"q":"Qual estrutura de dados segue a regra 'último a entrar, primeiro a sair'?","o":["Pilha","Fila","Árvore","Grafo"],"e":"Na pilha (LIFO) só se mexe no topo, como numa pilha de pratos. Na fila (FIFO) sai primeiro quem entrou primeiro."},{"id":"22wnak","c":"tecnologia","d":4,"q":"Qual é a complexidade de tempo, no pior caso, da busca binária em um vetor ordenado?","o":["O(log n)","O(n)","O(n log n)","O(1)"],"e":"A cada comparação metade dos elementos é descartada; para 1 milhão de itens bastam cerca de 20 passos."},{"id":"1i7bfj4","c":"tecnologia","d":4,"q":"Em qual camada do modelo OSI atua o protocolo TCP?","o":["Transporte","Rede","Sessão","Enlace"],"e":"A camada 4 cuida da entrega fim a fim entre processos. O IP atua na camada de rede (3)."},{"id":"1if53s7","c":"tecnologia","d":4,"q":"Qual é a porta padrão do protocolo HTTPS?","o":["443","80","22","8080"],"e":"A porta 80 é do HTTP sem criptografia e a 22 é do SSH. O HTTPS é o HTTP protegido por TLS."},{"id":"1mlwhnd","c":"tecnologia","d":4,"q":"A arquitetura em que programa e dados ficam na mesma memória leva o nome de quem?","o":["John von Neumann","Alan Turing","Claude Shannon","Konrad Zuse"],"e":"Descrita em relatório de 1945 sobre o EDVAC. Na arquitetura Harvard, instruções e dados ficam em memórias separadas."},{"id":"idlpe4","c":"tecnologia","d":4,"q":"Em qual laboratório o transistor foi inventado, em 1947?","o":["Bell Labs","Xerox PARC","IBM Research","MIT Lincoln Lab"],"e":"Bardeen, Brattain e Shockley receberam o Nobel de Física de 1956 pelo transistor, que substituiu as válvulas."},{"id":"1oeq5b7","c":"tecnologia","d":4,"q":"Qual destes algoritmos é de criptografia assimétrica (chave pública)?","o":["RSA","AES","DES","ChaCha20"],"e":"O RSA usa um par de chaves e se apoia na dificuldade de fatorar números grandes. Os outros três são simétricos."},{"id":"s8ygja","c":"tecnologia","d":4,"q":"Qual linguagem Dennis Ritchie criou no início dos anos 1970, ligada ao desenvolvimento do Unix?","o":["C","Pascal","Fortran","COBOL"],"e":"O C sucedeu a linguagem B e permitiu reescrever o Unix em linguagem de alto nível, tornando-o portável."},{"id":"lcucnf","c":"tecnologia","d":4,"q":"Qual ciclo termodinâmico ideal descreve os motores a gasolina com ignição por centelha?","o":["Ciclo Otto","Ciclo Diesel","Ciclo Rankine","Ciclo Brayton"],"e":"No Otto a combustão é modelada a volume constante. Rankine descreve usinas a vapor e Brayton, turbinas a gás."},{"id":"1f0aetm","c":"tecnologia","d":4,"q":"Nas propriedades ACID dos bancos de dados, o que a letra I representa?","o":["Isolamento","Integridade","Idempotência","Indexação"],"e":"ACID: Atomicidade, Consistência, Isolamento e Durabilidade. Isolamento evita que transações simultâneas interfiram entre si."},{"id":"ri81ly","c":"tecnologia","d":4,"q":"Que pioneira da computação desenvolveu o compilador A-0 no início dos anos 1950?","o":["Grace Hopper","Ada Lovelace","Hedy Lamarr","Margaret Hamilton"],"e":"Hopper criou o A-0 para o UNIVAC I e depois influenciou diretamente a criação da linguagem COBOL."},{"id":"j4yyin","c":"tecnologia","d":5,"q":"Que resultado prova ser impossível o consenso determinístico em sistema assíncrono com uma única falha?","o":["Resultado FLP","Teorema CAP","Teorema de Rice","Lei de Amdahl"],"e":"Publicado por Fischer, Lynch e Paterson em 1985. Algoritmos práticos contornam o limite com temporizadores ou aleatoriedade."},{"id":"vkstwu","c":"tecnologia","d":5,"q":"Qual é o tamanho do cabeçalho base (fixo) de um pacote IPv6?","o":["40 bytes","20 bytes","32 bytes","64 bytes"],"e":"O cabeçalho IPv6 tem tamanho fixo e opções em cabeçalhos de extensão. O mínimo do IPv4 é 20 bytes."},{"id":"76yxsw","c":"tecnologia","d":5,"q":"Qual foi o primeiro microprocessador comercial da Intel, lançado em 1971?","o":["4004","8008","8080","4040"],"e":"O 4004 era de 4 bits e foi projetado para uma calculadora da empresa japonesa Busicom. O 8008, de 8 bits, veio em 1972."},{"id":"nptxyn","c":"tecnologia","d":5,"q":"Qual foi o primeiro problema demonstrado NP-completo, por Stephen Cook em 1971?","o":["Satisfatibilidade booleana","Caixeiro-viajante","Cobertura de vértices","Soma de subconjuntos"],"e":"O teorema de Cook-Levin mostrou que todo problema em NP se reduz ao SAT. Em 1972, Karp listou outros 21."},{"id":"17pgqmt","c":"tecnologia","d":5,"q":"Qual é a altitude aproximada da órbita geoestacionária acima da superfície, sobre o equador?","o":["35.786 km","20.200 km","42.164 km","23.222 km"],"e":"O valor de 42.164 km é o raio da órbita medido do centro da Terra. Os satélites do GPS ficam a cerca de 20.200 km."},{"id":"vql1d5","c":"tecnologia","d":5,"q":"O computador Colossus, de Bletchley Park, foi construído para ajudar a quebrar qual cifra?","o":["Lorenz","Enigma","Purple","SIGABA"],"e":"A Enigma era atacada com as máquinas eletromecânicas Bombe. O Colossus atacava a cifra Lorenz, do alto comando alemão."},{"id":"16bap2j","c":"tecnologia","d":5,"q":"No padrão IEEE 754, quantos bits tem o campo de fração (mantissa armazenada) de um double de 64 bits?","o":["52","53","48","56"],"e":"São 1 bit de sinal, 11 de expoente e 52 de fração. Com o bit implícito, a precisão efetiva é de 53 bits."},{"id":"fvfuzr","c":"tecnologia","d":5,"q":"Qual número adimensional é a razão entre a difusividade de momento e a difusividade térmica?","o":["Prandtl","Nusselt","Schmidt","Grashof"],"e":"Pr = viscosidade cinemática / difusividade térmica. O número de Schmidt é o análogo para difusão de massa."},{"id":"oyt5v7","c":"tecnologia","d":5,"q":"Qual computador de programa armazenado a equipe de Maurice Wilkes pôs em operação em Cambridge em 1949?","o":["EDSAC","EDVAC","ENIAC","UNIVAC I"],"e":"O EDSAC inspirou-se no projeto do EDVAC e usava linhas de retardo de mercúrio como memória."},{"id":"hoc5b3","c":"tecnologia","d":5,"q":"Em qual RFC, de 1981, foi publicada a especificação clássica do protocolo TCP?","o":["RFC 793","RFC 791","RFC 768","RFC 821"],"e":"Do mesmo período: RFC 791 define o IP, RFC 768 o UDP e RFC 821 o SMTP."},{"id":"x5j6lz","c":"historia","d":1,"q":"Quem comandava a esquadra portuguesa que chegou ao Brasil em 1500?","o":["Pedro Álvares Cabral","Vasco da Gama","Cristóvão Colombo","Fernão de Magalhães"],"e":"Cabral partiu de Lisboa rumo às Índias e avistou o Monte Pascoal, na atual Bahia, em 22 de abril de 1500."},{"id":"263tdm","c":"historia","d":1,"q":"Qual civilização antiga construiu as pirâmides de Gizé?","o":["Egípcia","Romana","Grega","Persa"],"e":"As pirâmides de Gizé foram erguidas há cerca de 4.500 anos como túmulos para os faraós Quéops, Quéfren e Miquerinos."},{"id":"86to1h","c":"historia","d":1,"q":"Em que país foi construída a Grande Muralha para proteger o território de invasões?","o":["China","Japão","Índia","Mongólia"],"e":"A muralha foi erguida e ampliada por várias dinastias chinesas ao longo de séculos para conter povos vindos do norte."},{"id":"y1phh2","c":"historia","d":1,"q":"Qual princesa assinou a Lei Áurea, que acabou com a escravidão no Brasil?","o":["Princesa Isabel","Princesa Leopoldina","Princesa Januária","Princesa Francisca"],"e":"Isabel, filha de Dom Pedro II, assinou a lei em 13 de maio de 1888, quando governava como regente na ausência do pai."},{"id":"oyuu3q","c":"historia","d":1,"q":"Qual navegador chegou à América em 1492 a serviço da Espanha?","o":["Cristóvão Colombo","Vasco da Gama","Bartolomeu Dias","Américo Vespúcio"],"e":"Colombo buscava um caminho para as Índias navegando para oeste e desembarcou em ilhas do Caribe em outubro de 1492."},{"id":"14d55fd","c":"historia","d":1,"q":"Como eram chamados os reis do Egito Antigo?","o":["Faraós","Césares","Sultões","Czares"],"e":"O faraó era visto como um deus vivo e concentrava o poder político e religioso no Egito Antigo."},{"id":"1xyctuu","c":"historia","d":1,"q":"Em que cidade fica o Coliseu, a arena onde lutavam os gladiadores?","o":["Roma","Atenas","Cartago","Alexandria"],"e":"O Coliseu foi inaugurado no ano 80 d.C. e recebia dezenas de milhares de espectadores na capital do Império Romano."},{"id":"76fcys","c":"historia","d":1,"q":"Qual era a língua falada pelos antigos romanos?","o":["Latim","Grego","Hebraico","Aramaico"],"e":"Do latim nasceram as línguas românicas, como o português, o espanhol, o francês, o italiano e o romeno."},{"id":"1olpmkj","c":"historia","d":1,"q":"Em que data se comemora a Independência do Brasil?","o":["7 de setembro","15 de novembro","21 de abril","13 de maio"],"e":"Em 7 de setembro de 1822, Dom Pedro proclamou a independência às margens do riacho Ipiranga, em São Paulo."},{"id":"1rjjh6y","c":"historia","d":1,"q":"Qual navio famoso afundou em 1912 depois de bater em um iceberg?","o":["Titanic","Lusitania","Britannic","Bismarck"],"e":"O Titanic afundou no Atlântico Norte em sua viagem inaugural, entre a Inglaterra e Nova York, em abril de 1912."},{"id":"17p9omg","c":"historia","d":2,"q":"Em que ano foi proclamada a República no Brasil?","o":["1889","1822","1888","1891"],"e":"Em 15 de novembro de 1889 o marechal Deodoro da Fonseca liderou o golpe que pôs fim ao Império de Dom Pedro II."},{"id":"kmbplv","c":"historia","d":2,"q":"Quem foi o primeiro imperador do Brasil?","o":["Dom Pedro I","Dom Pedro II","Dom João VI","Dom Miguel"],"e":"Dom Pedro I foi coroado em 1822, após a independência, e abdicou em 1831 em favor do filho, então com cinco anos."},{"id":"15mn0kj","c":"historia","d":2,"q":"Qual acontecimento de 14 de julho de 1789 se tornou símbolo do início da Revolução Francesa?","o":["Queda da Bastilha","Batalha de Waterloo","Execução de Luís XVI","Coroação de Napoleão"],"e":"A Bastilha era uma prisão-fortaleza em Paris, símbolo do absolutismo; sua tomada é hoje a festa nacional francesa."},{"id":"s2vai2","c":"historia","d":2,"q":"Em que ano terminou a Segunda Guerra Mundial?","o":["1945","1939","1918","1950"],"e":"A Alemanha se rendeu em maio de 1945 e o Japão em setembro, após as bombas atômicas de Hiroshima e Nagasaki."},{"id":"fak33w","c":"historia","d":2,"q":"Qual povo construiu a cidade de Machu Picchu, nos Andes?","o":["Incas","Astecas","Maias","Olmecas"],"e":"Machu Picchu foi erguida no século XV, no atual Peru, e ganhou fama mundial após a expedição de Hiram Bingham, em 1911."},{"id":"1ypccge","c":"historia","d":2,"q":"Quem foi o primeiro presidente dos Estados Unidos?","o":["George Washington","Thomas Jefferson","Abraham Lincoln","Benjamin Franklin"],"e":"Washington comandou o exército na Guerra de Independência e tomou posse como presidente em 1789."},{"id":"1bwm9a","c":"historia","d":2,"q":"Qual foi a primeira capital do Brasil colonial?","o":["Salvador","Rio de Janeiro","Olinda","São Vicente"],"e":"Salvador foi fundada em 1549 para sediar o Governo-Geral e foi capital até 1763, quando a sede passou ao Rio de Janeiro."},{"id":"4cv7c8","c":"historia","d":2,"q":"Qual participante da Inconfidência Mineira foi enforcado em 1792?","o":["Tiradentes","Frei Caneca","Zumbi dos Palmares","Filipe dos Santos"],"e":"Joaquim José da Silva Xavier foi o único inconfidente executado; o dia de sua morte, 21 de abril, é feriado nacional."},{"id":"116padq","c":"historia","d":2,"q":"Em que cidade ficava o muro derrubado em 1989, símbolo da Guerra Fria?","o":["Berlim","Viena","Praga","Varsóvia"],"e":"Erguido em 1961, o muro separava a parte oriental, socialista, da parte ocidental, capitalista, da cidade."},{"id":"9w1inu","c":"historia","d":2,"q":"Quem desenvolveu a prensa de tipos móveis na Europa no século XV?","o":["Johannes Gutenberg","Leonardo da Vinci","Galileu Galilei","Nicolau Copérnico"],"e":"A prensa de Gutenberg, criada em Mainz por volta de 1450, barateou os livros e acelerou a circulação de ideias."},{"id":"qec5d3","c":"historia","d":3,"q":"Qual tratado de 1494 dividiu entre Portugal e Espanha as terras descobertas e por descobrir?","o":["Tratado de Tordesilhas","Tratado de Madri","Tratado de Utrecht","Tratado de Santo Ildefonso"],"e":"A linha passava 370 léguas a oeste de Cabo Verde: terras a leste seriam de Portugal e as a oeste, da Espanha."},{"id":"y51y8i","c":"historia","d":3,"q":"Qual tratado de 1919 impôs à Alemanha perdas territoriais e reparações após a Primeira Guerra?","o":["Tratado de Versalhes","Tratado de Brest-Litovsk","Tratado de Trianon","Tratado de Sèvres"],"e":"As duras condições de Versalhes alimentaram o ressentimento alemão, explorado depois pela propaganda nazista."},{"id":"1t3razw","c":"historia","d":3,"q":"Quem foi assassinado em Sarajevo em 1914, fato que desencadeou a Primeira Guerra Mundial?","o":["Francisco Ferdinando","Guilherme II","Nicolau II","Francisco José I"],"e":"O herdeiro do trono austro-húngaro foi morto pelo sérvio-bósnio Gavrilo Princip, acionando o sistema de alianças."},{"id":"109fecq","c":"historia","d":3,"q":"Como ficou conhecida a ditadura de Getúlio Vargas entre 1937 e 1945?","o":["Estado Novo","República Velha","Governo Provisório","República da Espada"],"e":"Vargas fechou o Congresso em 1937, outorgou uma Constituição autoritária e governou sem partidos até ser deposto."},{"id":"i7o449","c":"historia","d":3,"q":"Em que ano Constantinopla foi conquistada pelos turcos otomanos?","o":["1453","1492","1204","1517"],"e":"A conquista pelo sultão Maomé II encerrou o Império Bizantino e é um marco tradicional do fim da Idade Média."},{"id":"n32qlc","c":"historia","d":3,"q":"Qual documento de 1215, imposto ao rei João Sem Terra, limitou o poder real na Inglaterra?","o":["Magna Carta","Bill of Rights","Habeas Corpus Act","Petição de Direitos"],"e":"Os barões obrigaram o rei a aceitar que nem ele estava acima da lei, princípio básico do constitucionalismo."},{"id":"1y8e8ex","c":"historia","d":3,"q":"Quais países formaram a Tríplice Aliança contra o Paraguai entre 1864 e 1870?","o":["Brasil, Argentina e Uruguai","Brasil, Argentina e Chile","Brasil, Uruguai e Bolívia","Argentina, Chile e Uruguai"],"e":"A aliança foi firmada em 1865; a guerra terminou em 1870 com a morte de Solano López e o Paraguai devastado."},{"id":"yd1ura","c":"historia","d":3,"q":"Quem liderou a Longa Marcha e proclamou a República Popular da China em 1949?","o":["Mao Tsé-Tung","Chiang Kai-shek","Sun Yat-sen","Deng Xiaoping"],"e":"Mao venceu a guerra civil contra os nacionalistas de Chiang Kai-shek, que se refugiaram na ilha de Taiwan."},{"id":"vaohje","c":"historia","d":3,"q":"Qual sanitarista dirigia a campanha de vacinação que provocou a Revolta da Vacina, em 1904?","o":["Oswaldo Cruz","Carlos Chagas","Vital Brazil","Adolfo Lutz"],"e":"Oswaldo Cruz combatia varíola, febre amarela e peste no Rio; a vacinação obrigatória gerou dias de motins na cidade."},{"id":"117yttu","c":"historia","d":3,"q":"Em que era, iniciada em 1868, o Japão encerrou o xogunato e se modernizou rapidamente?","o":["Era Meiji","Era Edo","Era Heian","Era Showa"],"e":"A Restauração Meiji devolveu o poder ao imperador e promoveu industrialização e reformas inspiradas no Ocidente."},{"id":"1cadm0u","c":"historia","d":4,"q":"Qual acordo de 1648 encerrou a Guerra dos Trinta Anos?","o":["Paz de Vestfália","Paz de Augsburgo","Paz de Utrecht","Paz dos Pireneus"],"e":"Os tratados de Vestfália consagraram a soberania dos Estados e são vistos como base do sistema internacional moderno."},{"id":"1aih260","c":"historia","d":4,"q":"Qual revolta de 1835, em Salvador, foi organizada por africanos muçulmanos escravizados e libertos?","o":["Revolta dos Malês","Sabinada","Conjuração Baiana","Balaiada"],"e":"Malê vem do iorubá imale, muçulmano. O levante durou uma noite e foi duramente reprimido pelas autoridades."},{"id":"q8rb18","c":"historia","d":4,"q":"Qual batalha de 1066 garantiu a Guilherme da Normandia a conquista da Inglaterra?","o":["Hastings","Stamford Bridge","Agincourt","Bannockburn"],"e":"Em Hastings morreu o rei anglo-saxão Haroldo II; a conquista normanda transformou a língua e a nobreza inglesas."},{"id":"n0abw1","c":"historia","d":4,"q":"Qual imperador inca foi capturado em Cajamarca e executado pelos espanhóis em 1533?","o":["Atahualpa","Huáscar","Manco Cápac","Pachacútec"],"e":"Atahualpa acabara de vencer o irmão Huáscar numa guerra civil; pagou um enorme resgate em ouro e mesmo assim foi morto."},{"id":"1vnhlk6","c":"historia","d":4,"q":"Qual imperador romano criou a Tetrarquia, dividindo o governo entre quatro governantes?","o":["Diocleciano","Constantino","Teodósio","Aureliano"],"e":"No fim do século III, Diocleciano repartiu o poder entre dois augustos e dois césares para administrar o Império."},{"id":"n7xvg1","c":"historia","d":4,"q":"Qual encontro diplomático de 1814-1815 redesenhou o mapa europeu após as guerras napoleônicas?","o":["Congresso de Viena","Congresso de Berlim","Congresso de Verona","Congresso de Paris"],"e":"Conduzido por figuras como Metternich, buscou restaurar as monarquias e manter o equilíbrio entre as potências."},{"id":"1ymbx62","c":"historia","d":4,"q":"Qual reunião de 1884-1885 fixou regras para a ocupação da África pelas potências europeias?","o":["Conferência de Berlim","Conferência de Bruxelas","Conferência de Algeciras","Conferência de Haia"],"e":"Convocada por Bismarck, exigiu ocupação efetiva dos territórios e acelerou a partilha do continente africano."},{"id":"keng2g","c":"historia","d":4,"q":"Quem foi o primeiro governador-geral do Brasil, fundador de Salvador em 1549?","o":["Tomé de Sousa","Mem de Sá","Duarte da Costa","Martim Afonso de Sousa"],"e":"Tomé de Sousa chegou com os primeiros jesuítas, entre eles Manuel da Nóbrega, para centralizar a administração."},{"id":"1vp242s","c":"historia","d":4,"q":"Qual foi a última dinastia imperial da China, derrubada em 1912?","o":["Qing","Ming","Yuan","Song"],"e":"De origem manchu, os Qing governaram desde 1644; o último imperador, Puyi, abdicou ainda criança."},{"id":"1rfszah","c":"historia","d":4,"q":"Qual governante do Império do Mali ficou célebre pela peregrinação a Meca em 1324?","o":["Mansa Musa","Sundiata Keita","Sonni Ali","Askia Mohammed"],"e":"Mansa Musa distribuiu tanto ouro ao passar pelo Cairo que o valor do metal caiu na região por anos."},{"id":"15zsnxr","c":"historia","d":5,"q":"Qual diplomata nascido em Santos foi o principal articulador português do Tratado de Madri (1750)?","o":["Alexandre de Gusmão","Bartolomeu de Gusmão","Luís da Cunha","Sebastião de Carvalho"],"e":"Secretário de D. João V, defendeu o uti possidetis: a terra pertence a quem a ocupa de fato."},{"id":"163h3db","c":"historia","d":5,"q":"Qual batalha de 1071 abriu a Anatólia aos turcos seljúcidas após a derrota bizantina?","o":["Manzikert","Miriocéfalo","Yarmuk","Dorileia"],"e":"O sultão Alp Arslan derrotou e capturou o imperador Romano IV Diógenes, abalando o domínio bizantino na Ásia Menor."},{"id":"tse87q","c":"historia","d":5,"q":"Qual revolta regencial, no Maranhão, teve entre seus líderes Cosme Bento, o Negro Cosme?","o":["Balaiada","Cabanagem","Sabinada","Cabanada"],"e":"Ocorrida entre 1838 e 1841, uniu vaqueiros, artesãos e quilombolas e foi reprimida pelo futuro duque de Caxias."},{"id":"1rbi8gj","c":"historia","d":5,"q":"Qual jurista chefiou as comissões que compilaram o Corpus Juris Civilis de Justiniano?","o":["Triboniano","Procópio","Belisário","Ulpiano"],"e":"Triboniano coordenou a compilação no século VI; a obra se tornou a base do direito civil de boa parte da Europa."},{"id":"1wairls","c":"historia","d":5,"q":"Com qual rei hitita Ramsés II firmou um tratado de paz anos após a batalha de Kadesh?","o":["Hattusili III","Muwatalli II","Suppiluliuma I","Mursili II"],"e":"Muwatalli II enfrentou Ramsés em Kadesh; a paz veio com seu irmão Hattusili III, num dos tratados mais antigos conhecidos."},{"id":"1ou1vk7","c":"historia","d":5,"q":"Qual tratado de 1842 encerrou a Primeira Guerra do Ópio e cedeu Hong Kong aos britânicos?","o":["Tratado de Nanquim","Tratado de Tianjin","Tratado de Shimonoseki","Tratado de Whampoa"],"e":"Foi o primeiro dos chamados tratados desiguais, que também abriu cinco portos chineses ao comércio britânico."},{"id":"1n2d5w7","c":"historia","d":5,"q":"Qual imperador etíope derrotou o exército italiano na batalha de Adwa, em 1896?","o":["Menelik II","Tewodros II","Yohannes IV","Haile Selassie"],"e":"A vitória em Adwa garantiu a independência da Etiópia em plena partilha da África e virou símbolo anticolonial."},{"id":"boil93","c":"historia","d":5,"q":"Qual ministro da Fazenda do governo Deodoro conduziu a política conhecida como Encilhamento?","o":["Rui Barbosa","Joaquim Murtinho","Rodrigues Alves","Bernardino de Campos"],"e":"A emissão de moeda para estimular a indústria gerou especulação desenfreada na bolsa, inflação e falências."},{"id":"j7trdb","c":"historia","d":5,"q":"Quem foi o último rei merovíngio, deposto em 751 por Pepino, o Breve?","o":["Childerico III","Clóvis II","Dagoberto I","Clotário II"],"e":"Childerico foi tonsurado e enviado a um mosteiro; com Pepino começou a dinastia carolíngia entre os francos."},{"id":"ymkc0n","c":"historia","d":5,"q":"Quem assumiu o trono português após a morte de D. Sebastião em Alcácer-Quibir, em 1578?","o":["Dom Henrique","Dom António","Dom Duarte","Dom Afonso"],"e":"O cardeal D. Henrique, tio-avô de Sebastião, morreu em 1580 sem herdeiros, abrindo caminho à União Ibérica."},{"id":"o5l6bz","c":"geografia","d":1,"q":"Qual é a capital do Brasil?","o":["Brasília","Rio de Janeiro","São Paulo","Salvador"],"e":"Brasília foi inaugurada em 1960, no Planalto Central, para substituir o Rio de Janeiro como capital."},{"id":"iei3qs","c":"geografia","d":1,"q":"Qual é o maior oceano do planeta?","o":["Pacífico","Atlântico","Índico","Ártico"],"e":"O Pacífico cobre cerca de um terço da superfície da Terra e é maior do que todos os continentes somados."},{"id":"18gqq1m","c":"geografia","d":1,"q":"Em qual continente fica o Egito?","o":["África","Ásia","Europa","Oceania"],"e":"Quase todo o Egito fica no nordeste da África; apenas a península do Sinai pertence à Ásia."},{"id":"c93bhv","c":"geografia","d":1,"q":"Qual é a capital da França?","o":["Paris","Londres","Roma","Madri"],"e":"Paris fica às margens do rio Sena e abriga monumentos como a Torre Eiffel e o Museu do Louvre."},{"id":"13nu7il","c":"geografia","d":1,"q":"Qual é a maior floresta tropical do mundo?","o":["Floresta Amazônica","Floresta do Congo","Mata Atlântica","Floresta de Bornéu"],"e":"A Amazônia se estende por nove países da América do Sul, e a maior parte dela fica no Brasil."},{"id":"1p3b7bw","c":"geografia","d":1,"q":"Qual é a montanha mais alta do mundo acima do nível do mar?","o":["Everest","K2","Aconcágua","Kilimanjaro"],"e":"O Everest fica no Himalaia, na fronteira entre o Nepal e a China, e passa dos 8.800 metros de altitude."},{"id":"6l77to","c":"geografia","d":1,"q":"Qual oceano banha o litoral do Brasil?","o":["Atlântico","Pacífico","Índico","Antártico"],"e":"Todo o litoral brasileiro, do Amapá ao Rio Grande do Sul, é banhado pelo oceano Atlântico."},{"id":"4ch0dx","c":"geografia","d":1,"q":"Em que país ficam as cidades de Tóquio e Osaka?","o":["Japão","China","Coreia do Sul","Tailândia"],"e":"O Japão é um arquipélago no leste da Ásia; Tóquio e Osaka ficam em Honshu, a maior de suas ilhas."},{"id":"1p1k5si","c":"geografia","d":1,"q":"Qual continente é quase todo coberto de gelo e abriga o Polo Sul?","o":["Antártida","Oceania","Europa","Ásia"],"e":"A Antártida não tem moradores permanentes, só pesquisadores, e guarda a maior parte do gelo do planeta."},{"id":"d938m2","c":"geografia","d":1,"q":"Qual linha imaginária divide a Terra em hemisfério Norte e hemisfério Sul?","o":["Linha do Equador","Trópico de Câncer","Meridiano de Greenwich","Trópico de Capricórnio"],"e":"O Equador é o paralelo de latitude zero; já o Meridiano de Greenwich separa os hemisférios Leste e Oeste."},{"id":"1a8p3wd","c":"geografia","d":2,"q":"Qual é a capital da Argentina?","o":["Buenos Aires","Montevidéu","Santiago","Assunção"],"e":"Buenos Aires fica às margens do Rio da Prata, em frente ao Uruguai, e é o principal porto argentino."},{"id":"1vw7hz9","c":"geografia","d":2,"q":"Qual é o maior deserto quente do mundo?","o":["Saara","Kalahari","Gobi","Atacama"],"e":"O Saara ocupa boa parte do norte da África, do Atlântico ao Mar Vermelho, com área próxima à do Brasil."},{"id":"p6zgez","c":"geografia","d":2,"q":"Quais são os dois países da América do Sul que não fazem fronteira com o Brasil?","o":["Chile e Equador","Chile e Peru","Equador e Colômbia","Bolívia e Equador"],"e":"O Brasil faz fronteira com dez vizinhos; Chile e Equador ficam separados dele por outros países andinos."},{"id":"7844g2","c":"geografia","d":2,"q":"Qual cordilheira acompanha a costa oeste da América do Sul?","o":["Cordilheira dos Andes","Montanhas Rochosas","Cordilheira do Himalaia","Montes Apalaches"],"e":"Os Andes se estendem da Venezuela ao sul do Chile e formam a mais longa cadeia de montanhas em terra firme."},{"id":"1bf4o4q","c":"geografia","d":2,"q":"Qual é a capital da Austrália?","o":["Camberra","Sydney","Melbourne","Perth"],"e":"Camberra foi planejada para ser capital justamente por causa da rivalidade entre Sydney e Melbourne."},{"id":"qob9bm","c":"geografia","d":2,"q":"Qual região brasileira tem o maior número de estados?","o":["Nordeste","Norte","Sudeste","Centro-Oeste"],"e":"O Nordeste tem nove estados, do Maranhão à Bahia; a região Norte vem em seguida, com sete."},{"id":"1kgwy9a","c":"geografia","d":2,"q":"Qual rio atravessa o Egito e deságua no Mar Mediterrâneo?","o":["Nilo","Níger","Congo","Eufrates"],"e":"O Nilo corre de sul para norte e suas cheias anuais tornaram possível a agricultura em pleno deserto."},{"id":"b68hmq","c":"geografia","d":2,"q":"Qual é o menor país do mundo em área?","o":["Vaticano","Mônaco","San Marino","Liechtenstein"],"e":"O Vaticano fica dentro da cidade de Roma, tem menos de meio quilômetro quadrado e é a sede da Igreja Católica."},{"id":"ngovwu","c":"geografia","d":2,"q":"Qual bioma predomina no sertão do Nordeste brasileiro?","o":["Caatinga","Cerrado","Pampa","Pantanal"],"e":"A Caatinga é um bioma exclusivamente brasileiro, com plantas adaptadas à seca, como cactos e arbustos espinhosos."},{"id":"yr6msq","c":"geografia","d":2,"q":"Qual é a capital do Canadá?","o":["Ottawa","Toronto","Montreal","Vancouver"],"e":"Ottawa fica na divisa entre as províncias de Ontário e Quebec, entre as áreas de língua inglesa e francesa."},{"id":"19qwed7","c":"geografia","d":3,"q":"Qual estreito separa a Europa da África e liga o Atlântico ao Mediterrâneo?","o":["Estreito de Gibraltar","Estreito do Bósforo","Estreito de Ormuz","Estreito de Messina"],"e":"No ponto mais estreito, cerca de 14 km separam a Espanha do Marrocos."},{"id":"1hlkpm1","c":"geografia","d":3,"q":"Qual é o ponto mais alto do Brasil?","o":["Pico da Neblina","Pico da Bandeira","Monte Roraima","Pedra da Mina"],"e":"O Pico da Neblina fica no Amazonas, perto da Venezuela, e tem quase 3 mil metros de altitude."},{"id":"1bk3urz","c":"geografia","d":3,"q":"Qual é a capital da Turquia?","o":["Ancara","Istambul","Esmirna","Antália"],"e":"Ancara, no interior da Anatólia, virou capital em 1923 com a república de Atatürk; Istambul é a maior cidade."},{"id":"qfvd3w","c":"geografia","d":3,"q":"Qual rio nasce na Floresta Negra, na Alemanha, e deságua no Mar Negro?","o":["Danúbio","Reno","Elba","Volga"],"e":"O Danúbio atravessa dez países e banha quatro capitais: Viena, Bratislava, Budapeste e Belgrado."},{"id":"1s6k9ie","c":"geografia","d":3,"q":"Qual tipo de clima predomina na maior parte da região Sul do Brasil?","o":["Subtropical","Tropical","Semiárido","Equatorial"],"e":"Abaixo do Trópico de Capricórnio as estações são bem marcadas, com invernos frios, geadas e chuvas bem distribuídas."},{"id":"6jdw44","c":"geografia","d":3,"q":"Qual canal liga o Mar Mediterrâneo ao Mar Vermelho?","o":["Canal de Suez","Canal do Panamá","Canal de Corinto","Canal de Kiel"],"e":"Aberto em 1869 no Egito, o canal evita que navios entre Europa e Ásia precisem contornar a África."},{"id":"mog8pm","c":"geografia","d":3,"q":"Qual é o maior lago da África em superfície?","o":["Lago Vitória","Lago Tanganica","Lago Malawi","Lago Chade"],"e":"O Vitória é partilhado por Tanzânia, Uganda e Quênia e é a principal fonte do Nilo Branco."},{"id":"jwgw4c","c":"geografia","d":3,"q":"Quais são os dois únicos países da América do Sul sem saída para o mar?","o":["Bolívia e Paraguai","Bolívia e Uruguai","Paraguai e Equador","Paraguai e Uruguai"],"e":"A Bolívia perdeu seu litoral para o Chile na Guerra do Pacífico; o Paraguai acessa o mar pelos rios da bacia do Prata."},{"id":"1pjyjof","c":"geografia","d":3,"q":"Qual cadeia de montanhas russa, de norte a sul, é o limite tradicional entre Europa e Ásia?","o":["Montes Urais","Montes Cárpatos","Montes Altai","Montes Apeninos"],"e":"Os Urais são montanhas antigas e desgastadas, ricas em minérios, que se estendem por cerca de 2.500 km."},{"id":"468k7p","c":"geografia","d":3,"q":"Em qual estado brasileiro nasce o rio São Francisco?","o":["Minas Gerais","Bahia","Goiás","Pernambuco"],"e":"O Velho Chico nasce na Serra da Canastra e deságua no Atlântico, na divisa entre Alagoas e Sergipe."},{"id":"1hhd4xk","c":"geografia","d":4,"q":"Qual é a capital do Marrocos?","o":["Rabat","Casablanca","Marrakech","Fez"],"e":"Casablanca é a maior cidade e o centro econômico, mas a sede do governo e da monarquia fica em Rabat."},{"id":"e8jven","c":"geografia","d":4,"q":"Qual é o lago mais profundo do mundo?","o":["Baikal","Tanganica","Titicaca","Superior"],"e":"O Baikal, na Sibéria, passa de 1.600 m de profundidade e guarda cerca de um quinto da água doce líquida superficial."},{"id":"11nh90u","c":"geografia","d":4,"q":"Qual corrente marítima fria, na costa do Chile e do Peru, contribui para a aridez do Atacama?","o":["Corrente de Humboldt","Corrente de Benguela","Corrente do Labrador","Corrente das Canárias"],"e":"A água fria resfria o ar e dificulta a formação de chuva; em compensação, torna a região muito rica em peixes."},{"id":"f9aa82","c":"geografia","d":4,"q":"Qual estreito separa a ilha da Tasmânia do continente australiano?","o":["Estreito de Bass","Estreito de Torres","Estreito de Cook","Estreito de Malaca"],"e":"O Estreito de Torres fica ao norte, entre Austrália e Nova Guiné; o de Cook separa as ilhas da Nova Zelândia."},{"id":"1qso4vl","c":"geografia","d":4,"q":"Em qual país fica o monte Kilimanjaro, ponto mais alto da África?","o":["Tanzânia","Quênia","Uganda","Etiópia"],"e":"O Kilimanjaro é um vulcão isolado no nordeste da Tanzânia, bem perto da fronteira com o Quênia."},{"id":"1t16or9","c":"geografia","d":4,"q":"Qual é a única capital estadual brasileira cortada pela Linha do Equador?","o":["Macapá","Boa Vista","Belém","Manaus"],"e":"Em Macapá há o monumento Marco Zero; Boa Vista é a única capital totalmente situada no hemisfério Norte."},{"id":"1brnz0s","c":"geografia","d":4,"q":"Qual rio forma as Cataratas Vitória, na fronteira entre Zâmbia e Zimbábue?","o":["Zambeze","Limpopo","Okavango","Orange"],"e":"O Zambeze deságua no Índico, em Moçambique; as cataratas são chamadas localmente de Mosi-oa-Tunya."},{"id":"fv4aeb","c":"geografia","d":4,"q":"Qual país africano é inteiramente cercado pelo território da África do Sul?","o":["Lesoto","Essuatíni","Botsuana","Malawi"],"e":"O Lesoto é um reino montanhoso encravado; Essuatíni também é pequeno, mas faz fronteira com Moçambique."},{"id":"qz62ni","c":"geografia","d":4,"q":"Qual lago da Ásia Central encolheu drasticamente após o desvio de seus rios para irrigação?","o":["Mar de Aral","Mar Cáspio","Lago Zaysan","Lago Issyk-Kul"],"e":"A partir dos anos 1960, a irrigação de algodão desviou os rios Amu Darya e Syr Darya, secando grande parte do Aral."},{"id":"hrc32y","c":"geografia","d":4,"q":"Em qual estado fica a Ilha do Bananal, formada pelos braços do rio Araguaia?","o":["Tocantins","Mato Grosso","Goiás","Pará"],"e":"A ilha fica entre o Araguaia e o Javaés, no oeste do Tocantins, e abriga um parque nacional e terras indígenas."},{"id":"9rjl3f","c":"geografia","d":5,"q":"Qual é a capital de Palau, país insular do Pacífico?","o":["Ngerulmud","Koror","Majuro","Funafuti"],"e":"Koror, a maior cidade, foi capital até 2006, quando a sede do governo passou para Ngerulmud, na ilha de Babeldaob."},{"id":"10lxmsq","c":"geografia","d":5,"q":"Qual é o segundo ponto mais alto do Brasil, vizinho ao Pico da Neblina?","o":["Pico 31 de Março","Pico da Bandeira","Pedra da Mina","Monte Roraima"],"e":"O 31 de Março fica na mesma serra do Imeri, na fronteira com a Venezuela, e tem cerca de 2.970 m."},{"id":"9au9a3","c":"geografia","d":5,"q":"Qual lago salgado de Djibuti é o ponto mais baixo do continente africano?","o":["Lago Assal","Lago Abbe","Lago Turkana","Lago Natron"],"e":"O Assal fica a cerca de 155 m abaixo do nível do mar, na Depressão de Afar, e é um dos lagos mais salgados da Terra."},{"id":"13kj697","c":"geografia","d":5,"q":"Além de Liechtenstein, qual é o único país cercado apenas por países sem saída para o mar?","o":["Uzbequistão","Cazaquistão","Mongólia","Quirguistão"],"e":"São os dois paíse
